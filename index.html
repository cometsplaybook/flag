<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Playbook Builder</title>
<meta name="theme-color" content="#4169e1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Playbook">
<style>
:root{
  --cond:'Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif;
  --bg:#efece4; --panel:#fffdf8; --ink:#1b1f1d; --muted:#6b6f68; --line:#ddd8cc;
  --turf:#1f6b3f; --turf2:#17552f; --navy:#4169e1; --accent:#e8590c; --accent2:#fff1e6; --sel:#f59e0b;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.logo{font-family:var(--cond);font-stretch:condensed;font-weight:800;font-size:24px;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.logo svg{width:28px;height:28px}
.status{margin-left:auto;font-size:13px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:99px;white-space:nowrap}
.status.warn{background:#b45309}
.phoneonly{display:none!important}
#noteBar{position:fixed;left:50%;top:-140px;transform:translateX(-50%);width:min(520px,94vw);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:10px 38px 10px 14px;z-index:96;transition:top .25s;font-size:14px}
#noteBar.on{top:max(10px,env(safe-area-inset-top))}#noteBar button{position:absolute;right:8px;top:8px;border:0;background:none;font-size:16px;color:var(--muted)}
/* 📋 practice plan */
#ppEd{position:fixed;inset:0;z-index:60;background:var(--bg,#f1efe9);display:flex;flex-direction:column}
.pptop{display:flex;gap:10px;align-items:center;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.ppbody{flex:1;overflow:auto;padding:12px;padding-bottom:max(24px,env(safe-area-inset-bottom));max-width:760px;width:100%;margin:0 auto;box-sizing:border-box}
.ppblk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:0 0 8px}
.pphead{display:flex;gap:8px;align-items:center}.pptime{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;min-width:86px;color:var(--accent,#ea580c)}
.pphead .ppt{flex:1;min-width:0;font-weight:700}
.ppmin{display:flex;align-items:center;gap:2px;flex:none}.ppmin button{width:30px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:18px;line-height:1;color:var(--ink)}
.ppmin input{width:46px!important;text-align:center;padding:6px 2px!important}
.ppbar{display:flex;gap:6px;align-items:center;margin-top:6px}
.ppdet textarea{width:100%;min-height:70px}
.ppdr{display:flex;gap:6px;align-items:center;margin:0 0 6px}.ppdrb{flex:1;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);cursor:pointer}
.pplist{border-top:1px solid var(--line)}.ppro{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.pptm{width:48px;flex:none;font-weight:700;font-variant-numeric:tabular-nums}.pptm small{display:block;font-weight:400;color:var(--muted)}
.ppbd{flex:1;min-width:0}.ppd{white-space:pre-wrap;font-size:14px;margin-top:2px}
@media (max-width:640px){.pptime{min-width:0;font-size:12px;width:44px;white-space:normal;line-height:1.15}}

#ptr{position:fixed;left:50%;top:6px;width:34px;height:34px;border-radius:50%;background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:95;opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:18px;transition:opacity .15s}#ptr::before{content:'↻'}#ptr.ready{background:#2563eb;color:#fff}#ptr.spin{animation:ptrs .8s linear infinite;opacity:1!important}@keyframes ptrs{to{transform:translate(-50%,60px) rotate(360deg)}}
/* 🎬 film */
.fmwrap{max-width:1100px;margin:0 auto;padding:14px}
.fmhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.fmhead h2{margin:0 8px 0 0;font-family:var(--cond);text-transform:uppercase}
.fmhead select{width:auto;flex:none;max-width:48vw}
.fmgrp{margin:18px 0 8px;font-size:16px}
.fmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fmcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.fmopen{border:0;padding:0;background:#111;position:relative;aspect-ratio:16/9;display:block;width:100%;cursor:pointer}
.fmopen img{width:100%;height:100%;object-fit:cover;display:block}.fmnopic{color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;height:100%}
.fmopen::after{content:'▶';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.fmdur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:1px 6px;border-radius:6px}
.fmnew{position:absolute;left:6px;top:6px;background:#dc2626;color:#fff;font-size:12px;font-weight:700;padding:2px 7px;border-radius:99px}
.fmtxt{padding:8px 40px 10px 10px;display:flex;flex-direction:column;gap:2px}.fmtxt .hint{font-size:12px}
.fmmenu{position:absolute;right:6px;bottom:8px}
#fmBusy{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:center;justify-content:center}
#fmBusy .fmbox{background:var(--panel);border-radius:14px;padding:18px;width:min(420px,90vw);text-align:center}
#fmBusy .fmbar{height:8px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}#fmBusy .fmbar i{display:block;height:100%;background:var(--accent,#2563eb);transition:width .2s}
#filmPl{position:fixed;inset:0;z-index:60;background:#0d0f10;color:#fff;display:flex;flex-direction:column}
body.fmopen{overflow:hidden}
body.fmopen .mback{z-index:70}body.fmopen .toast{z-index:75}   /* windows and messages always in front of the video */
#filmPl .hint{color:#aab}
.fptop{display:flex;gap:10px;align-items:center;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
.fpmain{flex:1;display:flex;min-height:0}
.fpstage{flex:1;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:6px}
.fpbox{position:relative}.fpbox video,.fpbox canvas{position:absolute;inset:0;width:100%;height:100%}.fpbox canvas{touch-action:none}
#filmPl.editing .fpbox canvas{cursor:crosshair;outline:2px dashed #ffd60a;outline-offset:2px}
.fpload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ccc;min-width:200px;min-height:120px}
.fpgo{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#fff;color:#111;border:0;border-radius:99px;padding:8px 16px;font-weight:700}
.fpside{width:320px;overflow:auto;padding:8px 12px;border-left:1px solid #2a2e30}
.fpq{background:#1d2a3a;border-radius:10px;padding:10px;margin-bottom:8px}
.fplinks,.fpmarks{margin:6px 0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.fpth{background:#181b1d;border-radius:10px;padding:8px;margin:6px 0}.fpth summary{cursor:pointer}
.fpth textarea{width:100%;min-height:54px;margin:6px 0 4px;background:#0d0f10;color:#fff;border:1px solid #333;border-radius:8px;padding:6px;box-sizing:border-box}
.fpwt{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}.fpwt td{padding:3px 4px;border-bottom:1px solid #2a2e30}.fpwt td:nth-child(2){text-align:right;font-variant-numeric:tabular-nums}
.fpmsg{background:#22272a;border-radius:8px;padding:6px 8px;margin:4px 0}.fpmsg.me{background:#1d3324}
.fptools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 12px;background:#1a1d1f}
.fpcol{width:26px;height:26px;border-radius:50%;border:2px solid #555;padding:0}.fpcol.on{border-color:#fff;box-shadow:0 0 0 2px #0a84ff}
.fpctl{display:flex;gap:6px;align-items:center;padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.fpbar{flex:1;position:relative}.fpbar input{width:100%}.fpticks i{position:absolute;top:-4px;width:3px;height:8px;background:#ffd60a;border-radius:2px;transform:translateX(-1px);pointer-events:none}
.fptime{font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
#filmPl .btn{background:#2a2e30;color:#fff;border-color:#3a3f42}#filmPl .btn.primary{background:var(--accent,#ea580c);border-color:transparent}#filmPl .btn.on{background:#fff;color:#111}
#filmPl select{background:#2a2e30;color:#fff;border:1px solid #3a3f42;border-radius:8px;padding:4px;width:auto;flex:none}
#filmPl [hidden],#fmBusy [hidden]{display:none!important}
@media (max-width:900px){.fpmain{flex-direction:column}.fpstage{flex:none;height:min(56vh,62vw)}.fpside{width:auto;border-left:0;border-top:1px solid #2a2e30;flex:1}}
.linkbtn{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px}

details.hsec{border-bottom:1px solid var(--line)}details.hsec>summary{cursor:pointer;font-weight:700;font-size:16px;padding:10px 2px;list-style:none;display:flex;align-items:center;gap:8px}
details.hsec>summary::-webkit-details-marker{display:none}details.hsec>summary::after{content:'›';margin-left:auto;font-size:20px;color:var(--muted);transition:transform .15s}details.hsec[open]>summary::after{transform:rotate(90deg)}
details.hsec>ul{margin:0 0 10px;padding-left:20px}details.hsec>ul>li{margin:0 0 6px}
.hbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-weight:600}
.hbtn:hover{background:rgba(255,255,255,.25)}
.app{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:12px;padding:12px;min-height:calc(100vh - 52px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
aside.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.pbhead{display:flex;gap:6px}
.pbhead select{flex:1;min-width:0}
select,input[type=text],input[type=email],input[type=password],textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
textarea{resize:vertical;min-height:90px}
.chip{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:99px;background:var(--accent2);color:var(--accent)}
.chip.def{background:#e7eefc;color:#1d4ed8}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:#bdb6a6;background:#faf8f2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#d24f08}
.btn.danger{color:#b91c1c}
.btn.sm{padding:4px 8px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.plays{flex:0 1 auto;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:120px;max-height:min(calc(100vh - 290px),var(--plh,554px))}
.play{display:grid;grid-template-columns:22px 64px 1fr auto;gap:8px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.play:hover{border-color:#bdb6a6}
.play.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent2)}
.play .num{font-family:var(--cond);font-stretch:condensed;font-weight:800;font-size:18px;text-align:center}
.play svg{width:64px;height:auto;border-radius:4px;display:block;border:1px solid var(--line)}
.play .nm{font-weight:600;line-height:1.15;overflow:hidden;text-overflow:ellipsis}
.play .ct{font-size:12px;color:var(--muted)}
.play .mv{display:flex;flex-direction:column}
.grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--muted);font-size:20px;line-height:1;padding:8px 4px}.grip:hover{color:var(--ink)}
.play.dragging{position:relative;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.25);background:#fff;cursor:grabbing}
.play.dropbefore{box-shadow:0 -3px 0 0 var(--accent)}.play.dropafter{box-shadow:0 3px 0 0 var(--accent)}.play.dropleft{box-shadow:-3px 0 0 0 var(--accent)}.play.dropright{box-shadow:3px 0 0 0 var(--accent)}
.play .mv button{border:0;background:none;padding:0 4px;color:var(--muted);font-size:12px;line-height:1.3}
.play .mv button:hover{color:var(--ink)}
.sidefoot{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.center{display:flex;flex-direction:column;gap:10px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toolbar .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.toolbar select{width:auto}
.fieldwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;justify-content:center;align-items:flex-start;flex:1}
#field{width:100%;touch-action:pinch-zoom;user-select:none;-webkit-user-select:none;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#field.m-route,#field.m-motion,#field.m-add{cursor:crosshair}
#field .pl{cursor:grab}
#field [data-h]{cursor:move}
.zoom{display:inline-flex;align-items:center;gap:6px;font-size:14px;margin-left:auto}
.zoom input{width:120px;accent-color:var(--accent);border:0;padding:0;background:none}
.rv{display:inline-block;min-width:30px;margin-left:4px;padding:0 6px;border-radius:6px;background:var(--accent2);color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.lockfs{border:0;padding:0;margin:0;min-width:0}
.lockfs[disabled]{opacity:.6}
.lockbtn.locked{background:#fef3c7;border-color:#f59e0b}
.picklist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff}
.picklist label{display:flex!important;gap:6px;align-items:center;font-weight:400!important;margin:0!important;padding:4px 0;border-bottom:1px solid #f1eee6;cursor:pointer}
.picklist label:last-child{border-bottom:0}
.picklist small{color:var(--muted)}
.picklist small.tagnew{color:#15803d;font-weight:700}.picklist small.tagupd{color:#c2410c;font-weight:700}
.folderbox{grid-column:1/-1;display:flex;gap:6px;align-items:center;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:7px;padding:2px 4px 2px 8px;font-size:12px;min-width:0}
.folderbox b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.folderbox .fbok{color:#15803d;font-size:11px;white-space:nowrap}
.folderbox .fboff{margin-left:auto;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;cursor:pointer;padding:3px 4px;text-decoration:underline}
html.night .folderbox .fbok{color:#86efac}
.fbshot{border:1px dashed var(--line);border-radius:8px;padding:6px;background:#fff;max-height:220px;overflow:auto;text-align:center}
.fbshot img{max-width:100%;display:block;margin:auto}
#laser{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:70;display:none}
body.lasering,body.lasering *{cursor:none!important}
.laserbtn.on{background:#dc2626;border-color:#dc2626;color:#fff}
#printRoot{display:none}
@media print{
  @page{size:A4;margin:0}
  body.printing>*:not(#printRoot){display:none!important}
  body.printing{background:#fff}
  body.printing #printRoot{display:block}
  .ppage{width:210mm;height:296mm;page-break-after:always;break-after:page;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;padding:10mm;box-sizing:border-box}
  .ppage:last-child{page-break-after:auto;break-after:auto}
  .ppage svg{width:190mm;height:auto;max-height:276mm}
  .ppage.real{padding:0}.ppage.real svg{width:210mm;height:297mm;max-height:none}
  .ppage.land{width:297mm;height:209mm}.ppage.land svg{width:277mm;max-height:189mm}
}
.mback.busy{z-index:200}
.acct-tabs{display:flex;gap:6px;margin-bottom:10px}
.share-row{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.share-row select{width:auto;max-width:44vw}
@media (max-width:640px){.fbchoice{grid-template-columns:1fr 1fr!important}}
@media (max-width:640px){.share-row{grid-template-columns:1fr auto auto}.share-row>span{grid-column:1/-1;min-width:0}.share-row select{width:100%;max-width:none}}
.share-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.shared{background:#e0e7ff;color:#3730a3}
@keyframes qpulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.7)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
#acctBtn.on{background:rgba(255,255,255,.28)}
.kindtabs{display:flex;gap:4px;margin:6px 0 2px}.kindtabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 2px;font-size:12px;cursor:pointer}
.kindtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.plgroup{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;background:#f1efe9;border-radius:7px;cursor:pointer;font:inherit;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;grid-column:1/-1;margin:2px 0}
.plgroup:hover{color:var(--ink)}.plgroup span{font-size:12px;width:10px}
.play.isform .num{background:#e0e7ff;color:#3730a3;font-size:12px}
.newrow{display:grid;grid-template-columns:1fr auto;gap:6px}.newrow .btn{white-space:nowrap;padding-left:8px;padding-right:8px}
.cpick{display:inline-block;width:26px;height:26px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;cursor:pointer;vertical-align:middle;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.cpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.chk{display:flex;gap:6px;align-items:center;color:var(--ink);font-weight:400;margin-top:6px}
.qitem{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:0 0 6px;background:#fff}
.qitem.done{opacity:.6}.qhead{display:flex;gap:6px;align-items:center;font-size:12px}.qhead span{color:var(--muted);flex:1}
.qdel{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px}
.qtext{font-size:14px;white-space:pre-wrap;margin-top:2px}.qlike{border:1px solid var(--line,#ddd);background:#fff;border-radius:10px;padding:0 6px;font-size:12px;cursor:pointer;margin-left:4px;white-space:nowrap}.qlike.on{background:#dbeafe;border-color:#93c5fd}
.qpen{border:0;background:none;cursor:pointer;color:var(--muted,#6b7280);font-size:13px;padding:0 2px}.qpen:hover{color:var(--accent,#ea580c)}.qedit{margin-top:4px}
.qans{font-size:13px;margin-top:4px;padding:4px 6px;background:#eef2ff;border-radius:6px;white-space:pre-wrap}
.qact{display:flex;gap:4px;align-items:center;margin-top:4px}.qact input[type=text]{flex:1;min-width:0;padding:4px 6px;font-size:13px}.qact label{font-size:12px;display:flex;gap:3px;align-items:center;white-space:nowrap;color:var(--ink)}
#qNew{width:100%;font-size:13px}.qbadge{font-size:11px;background:#fde68a;color:#7c2d12;border-radius:8px;padding:0 5px;font-weight:700}.qbadge.wait{background:#dc2626;color:#fff}
#quizPanel{position:fixed;left:12px;top:calc(var(--pbh,52px) + 12px);width:230px;max-height:calc(100vh - var(--pbh,52px) - 28px);overflow:auto;z-index:41;background:rgba(255,253,248,.97);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
#quizPanel h4{margin:0 0 6px}#quizPanel p{font-size:14px;margin:6px 0}
.qopts{display:flex;flex-direction:column;gap:5px}.qopt{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font:inherit;font-size:15px;font-weight:600;text-align:left;cursor:pointer}
.qopt:hover{border-color:var(--ink)}.qopt.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}

const APP_NOTES=["S: 📍 Beim Ort eines Termins schlägt die App die bisher benutzten Orte vor","S: 🏃 Training als eigene Termin-Art – auch als Serie (z. B. jeden Mo + Sa für 10 Wochen); einzelne löschen oder auf 🚫 Trainingsfrei stellen","S: 🔔 Tippst du auf eine Benachrichtigung, zeigt die App oben, worum es ging; unter 👤 → 🔔 stehen die letzten Benachrichtigungen","S: 📋 Neu: Practice Plan am Trainingstermin – Blöcke mit Uhrzeiten, Übungs-Bibliothek, Vorlagen, optional Plays; Spieler sehen ihn beim Termin, Teilen per WhatsApp","S: ↻ Handy: oben herunterziehen holt die neuesten Daten (auch in der installierten App)","S: ☁ Mit „Speichern im Ordner“ zeigt die Leiste jetzt auch den Cloud-Stand; was nur auf diesem Gerät liegt, steht im 👤 Konto mit „☁ Jetzt hochladen“","S: 👁 Film: Coaches sehen, welcher Spieler einen Clip wie lange angeschaut hat","S: 🎬 Neu: Film – kurze Spielszenen hochladen (die App macht sie klein), mit Pfeilen/Kreisen/Text markieren, Frage an die Spieler; Spieler antworten oder fragen selbst. Clips mit Plays/Game Plans verbinden, als Datei sichern und wieder laden","S: ❓ Hilfe nach Themen sortiert zum Auf- und Zuklappen – neu mit Schritt-für-Schritt-Anleitung „🔔 Benachrichtigungen einschalten“ für iPhone, Android und PC","S: 📱 Handy: obere Leiste passt wieder auf den Bildschirm – Sync-Status nur als Symbol, 👤 ohne Namen, 🌙 Nachtmodus und ✉ Feedback jetzt im 👤 Konto-Fenster","S: ⚡ Kommt eine Benachrichtigung, holt die offene App die Neuigkeit sofort – Fragen, Termine und Game Plans erscheinen gleich, nicht erst nach einer Minute","S: 🔴 Neuigkeiten als rote Zahl am App-Symbol (iPhone-App vom Home-Bildschirm, Chrome/Edge am PC) – verschwindet beim Öffnen der App","S: 🔔 Antippen einer Benachrichtigung öffnet direkt den Termin, den Game Plan bzw. das Play mit der Frage","S: 🔔 Benachrichtigungen aufs Handy: Konto → „🔔 Benachrichtigungen“ – bei Terminen und Game Plans, wenn der Coach „🔔 Team benachrichtigen“ wählt, und bei Fragen/Antworten zu Plays (iPhone: erst „Zum Home-Bildschirm“)","🔧 Zonen direkt am Spieler (z. B. LB-Zone in Green) verschwinden nicht mehr und stehen im Playbook-PDF mit Aufgabe und Details","📝 Neu beim Spieler: Feld „Details“ – erscheint im Playbook-PDF in der Spalte DETAILS","📍 Kalender: Ort antippen öffnet Google Maps, „🚗 Navigation“ startet auf dem Handy direkt die Route","📥 Import „Mein Playbook aktualisieren“: importierte Plays behalten ihren Zeitstempel – eine spätere Datei wird dadurch zuverlässig übernommen","S: 🎨 Feld Hell / Rasen / Dunkel jetzt auch in Präsentation und Lernen umschaltbar","📥 Game Plan: „Plays importieren“ – Plays und Formationen aus dem Playbook auswählen und übernehmen; oben ist dann „Game Week“ markiert","🗑 Game Weeks direkt löschen: Knopf 🗑 oben in der Game Week und im Reiter Game Week (Papierkorb, 30 Tage wiederherstellbar)","☑ Markieren: die Play-Liste springt nicht mehr nach oben","📅 Kalender: neuer Termin per Doppelklick auf den Tag","🪟 Fenster schließen sich nicht mehr, wenn du Text markierst und mit der Maus aus dem Fenster fährst","📅 Kalender: H blau, A grün; Haken „🔒 Coaches only“ – solche Termine sehen Spieler nicht","S: 📅 Kalender (Reiter oben): Spiele, Turniere mit mehreren Gegnern und andere Termine – H/A als Wasserzeichen am Tag. 🗓 Reiter Game Week: pro Termin keinen, einen oder mehrere Game Plans anlegen, für ausgewählte Gegner","S: 🗓 Game Week: Plays und Formationen links mit ☑ Markieren auswählen und als Kopie in eine Game Week für einen Gegner übernehmen – mit Scouting-Notizen, Gegner-Routen, Archiv und Rückspiel","👁 Gegner-Routen: nur sichtbar, wenn eingeschaltet (Knopf neben „Gegner“), nie im Druck. Beim Abspielen bleibt Man am Mann, Zone nimmt Receiver in ihrer Zone auf und übergibt sie","🏈 Gegner-Spieler bekommen jetzt auch Routen und Motion (Vorlagen, selbst zeichnen) – sie laufen beim Abspielen mit","📋 Linke Spalte: Play-Liste zeigt ca. 8 Plays (scrollen für mehr), der Ordner-Hinweis ist jetzt eine schmale Zeile","🌙 Nachtmodus für die ganze App (Knopf 🌙 oben rechts) – das Feld lässt sich wie bisher unabhängig auf Hell, Rasen oder Dunkel stellen","👥 Gegner: „Gegner: aus“ blendet sie nur aus (Man-Zuordnungen bleiben), „🗑 Gegner löschen“ entfernt sie – der doppelte Haken „Gegner anzeigen“ ist weg","S: 🧭 Rechte Spalte neu sortiert: „Linie bearbeiten“ steht oben, Aussehen und Linienfarbe sind eingeklappt (merkt sich offen/zu); Tempo jetzt in Stufen 0,5× bis 2,5×","🎓 „nur wenn … auf meine Seite geht“ erscheint jetzt nur bei Man-Linien, wenn zwei Spieler denselben Gegenspieler covern – und gilt für jeden Gegenspieler, nicht nur den RB","S: 🎓 Lernen Defense: Hat ein Spieler Blitz und eine andere Aufgabe, kommt zufällig die Ansage „mit Blitz“ oder „ohne Blitz“ – danach wird auch die andere Variante abgefragt","🎓 Neu bei „Linie bearbeiten“ (Defense): „nur wenn der RB auf meine Seite geht“ – beim Lernen läuft der RB dann zufällig nach links oder rechts (roter Pfeil)","❓ Hilfe auf den neuesten Stand gebracht","📕 Team Philosophie: Fett, Kursiv und Unterstrichen siehst du jetzt sofort beim Schreiben – kleine Knöpfe wie in Word, auch Strg+B / Strg+I / Strg+U","📕 Playbook (PDF): In der Team Philosophie gibt es jetzt Fett, Kursiv und Unterstrichen (Knöpfe F / K / U über dem Textfeld)","S: 〰 Motion wird jetzt automatisch als Wellenlinie gezeichnet","📏 Hilfslinien gibt es jetzt auch beim gemeinsamen Verschieben mehrerer Spieler – am Spieler, den du anfasst; er rastet an anderen Spielern ein (Alt = frei)","☑ Mehrere: ausgewählte Spieler lassen sich jetzt auch direkt gemeinsam ziehen – kurz antippen ohne Ziehen nimmt einen Spieler wieder aus der Auswahl","🟦 Zonen bleiben jetzt an ihrem Platz, wenn du den Spieler verschiebst – mit gedrückter Shift-Taste (erst nach dem Anfassen drücken) wandert die Zone wie bisher mit","📕 Playbook (PDF): „Deep ⅓“ erscheint jetzt als „Deep 1/3“ statt „Deep ?“","📕 „Playbook-Buch“ heißt jetzt „Playbook“, das bisherige Playbook mit Spalten heißt „Playbook (vereinfacht)“","↕ Line of Scrimmage verschieben: Das ganze Play bewegt sich jetzt mit","S: 🏈 Spielfeld (Flag 5er): Die dicke Linie hinter dem QB ist jetzt die Goal Line der Offense und liegt am Feldrand; die Yard-Zahlen zählen von ihr aus","📏 Hilfslinien: halbe Yards dazwischen, und die Abstands-Striche gibt es jetzt auch links und rechts neben dem Spieler","S: ▶ Abspielen: Steht ein anderer Spieler (z. B. RB) direkt hinter dem C, geht der Snap an ihn und er gibt den Ball an den QB weiter","📏 Hilfslinien: Beim Halten eines Spielers erscheinen eine waagrechte und eine senkrechte Linie – steht er mit einem anderen Spieler in einer Linie, rastet er ein und die Linie wird orange (Alt-Taste = frei setzen)","S: 💬 Fragen: auf eine Antwort direkt nachfragen oder mit 👍 reagieren – Coaches sehen „✓ gelesen“ und bekommen Nachfragen als offene Frage oben angezeigt","💬 Fragen: mehrere Antworten pro Frage, ✎ zum Ausbessern der eigenen Frage oder Antwort; angefangene Antworten bleiben erhalten, das Feld wird beim Reinklicken größer","👥 Freigeben: neuer Knopf „🚫 Nicht mehr teilen“ – beendet Team- und Einzel-Freigaben in einem Schritt","💬 Offene Fragen von Spielern stehen jetzt als roter Knopf oben in der Kopfzeile – antippen zeigt alle und springt zum Play","S: Das Team-Logo steht jetzt oben neben „Playbook Builder“","👥 Team-Liste: Feld „Dein Name“ – Spieler sehen bei geteilten Playbooks deinen Namen statt der E-Mail-Adresse","👤 Der Playbook Builder läuft jetzt nur mit Konto – ohne Anmeldung gibt es nur die Anmeldung. Beim Abmelden bleiben keine Playbooks auf dem Gerät zurück","👥 Spieler (in der Team-Liste nur als Spieler eingetragen) haben keine eigenen Playbooks mehr – nur die geteilten","📁 Der verbundene Ordner gehört zum Konto, das ihn verbunden hat – meldet sich im selben Browser ein anderes Konto an, wird der Ordner nicht benutzt","S: ▶ Abspielen: Spieler in Motion laufen ohne Stopp direkt in ihre Route weiter","🏈 Neu bei Offense-Plays: „Ball beim Abspielen“ – erst ein oder zwei Fakes, dann Ball an QB (behält), Read 1 oder einen bestimmten Spieler (Handoff, Pitch oder Pass)","S: ▶ Abspielen: Bei Plays der Kategorie „Run“ übergibt der QB den Ball an den RB (Handoff) – oder pitcht ihn, wenn seine Linie die Aufgabe „Pitch“ hat","S: ▶ Abspielen: Hat der QB eine Linie mit der Aufgabe „Pitch“, bleibt er stehen und wirft den Ball zum Runner","🔑 Freischalten nur noch mit Code vom Coach – eine Bestätigungs-Mail schickt nur der Admin (beim 🔑 in der Team-Liste: „📧 Stattdessen Mail“)","📤 „Playbook teilen“ neu: gemeinsam nutzen (Team oder einzelne Personen) oder als Kopie-Datei weitergeben – ohne Textwust","🎓 Lernen: sind alle Aufgaben beantwortet, ist der QB gleich ausgewählt und die Reads lassen sich direkt antippen","👥 Team-Liste: Spieler bekommen nur die Playbooks ihrer Positionen (z. B. nur CB, SS → nur Defense; QB und SS → beide; ohne Position → alle)","👥 Team-Liste: Positionen pro Person (z. B. „QB, SS“) – beim 🎓 Lernen müssen nur Spieler mit QB die Reads eintragen","👥 Team-Liste: zu jeder E-Mail-Adresse lässt sich ein Name eintragen – im 📊 Fortschritt und bei 💬 Fragen steht dann der Name statt der Adresse","✉ Nach dem Registrieren passt der Text jetzt für Coaches und Spieler","🆕 Spieler sehen nach einem Update nur noch Neuerungen, die für sie wichtig sind","📊 Fehler behoben: Der Lern-Fortschritt von Spielern kam beim Coach nicht an","📕 Playbook-Buch: breiterer Rand, damit beim Drucken oben und unten nichts abgeschnitten wird; gegnerische Spieler auf den Zeichnungen dunkler","📕 Playbook-Buch: leere Ränder um Logo und Deckblatt-Bild werden abgeschnitten – das Logo sitzt jetzt genau in der Mitte","📕 Playbook-Buch als PDF: Text, Tabellen und Rahmen sind jetzt echte, scharfe Schrift (durchsuchbar), nur die Zeichnungen sind Bilder – kleinere Datei","📕 Playbook-Buch wird jetzt direkt als PDF-Datei gespeichert – ohne Datum und Web-Adresse vom Browser, auch auf Tablet und Handy","📕 Playbook-Buch: saubere Ecken an allen Rahmen, gleiche Aufgaben stehen in der Tabelle nur einmal (nicht „Man / Man“)", /* layout template: copy look (shape, colours, route colours, zone/text style) from one play to another */
function applyLayout(tpl,pl){
  const matchList=(src,dst)=>{const seen={};dst.forEach(p=>{const k=(p.label||'').toUpperCase();const n=seen[k]=(seen[k]||0)+1;
      const cand=src.filter(q=>(q.label||'').toUpperCase()===k);const t=cand[Math.min(n,cand.length)-1];if(!t)return;
      p.shape=t.shape;p.color=t.color;if(t.fill)p.fill=t.fill;else delete p.fill;
      const rc=t.route&&t.route.color,mc=t.motion&&t.motion.color;
      if(p.route&&rc)p.route.color=rc;if(p.route&&t.route&&t.route.w)p.route.w=t.route.w;if(p.motion&&(mc||rc))p.motion.color=mc||rc;
      const tw=t.route&&t.route.w;if(p.motion&&tw)p.motion.w=tw;(p.alts||[]).forEach(r=>{if(tw)r.w=tw});
      (p.alts||[]).forEach((r,j)=>{const ac=(t.alts&&t.alts[j]&&t.alts[j].color)||(t.alts&&t.alts[0]&&t.alts[0].color)||rc;if(ac)r.color=ac});});};
  matchList(tpl.players,pl.players);matchList(tpl.opp||[],pl.opp||[]);
  ['zone','text','bolt'].forEach(type=>{const t=(tpl.marks||[]).find(m=>m.type===type);if(!t)return;
    (pl.marks||[]).filter(m=>m.type===type).forEach(m=>{m.color=t.color;
      if(type==='zone'){m.opacity=t.opacity;m.border=t.border;m.dashed=t.dashed;if(t.bcolor)m.bcolor=t.bcolor;else delete m.bcolor;if(t.bw)m.bw=t.bw;else delete m.bw}})});
}
// line width for a new line: like this player's own line, else like the layout template (same label first), else 1.4
function defW(p){const pb=curPb(),t=pb&&layoutTpl(pb);if(p&&p.route&&p.route.w)return p.route.w;
  if(t){const all=[...t.players,...(t.opp||[])];const m=all.find(q=>(q.label||'').toUpperCase()===((p&&p.label)||'').toUpperCase()&&q.route&&q.route.w);if(m)return m.route.w;
    const ws={};all.forEach(q=>[q.route,...(q.alts||[])].forEach(r=>{if(r&&r.w)ws[r.w]=(ws[r.w]||0)+1}));const best=Object.entries(ws).sort((a,b)=>b[1]-a[1])[0];if(best)return +best[0]}
  return 1.4}
function layoutTpl(pb){return pb.layoutPlayId?pb.plays.find(x=>x.id===pb.layoutPlayId)||null:null}
/* Flag field grew from 25 to 53.3 yards wide: spread old flag plays horizontally so everything
   keeps its place relative to the field. Depths (yards from the LOS) stay unchanged. */
const FLAG_V=2,FLAG_K=53.3/25;
function scalePlayX(pl,k){
  const sr=r=>{if(!r)return;(r.pts||[]).forEach(q=>q.x=r1(q.x*k));if(r.end==='zone')r.zw=r1((r.zw||7.6)*k)};
  [...(pl.players||[]),...(pl.opp||[])].forEach(p=>{p.x=r1(p.x*k);sr(p.route);sr(p.motion);(p.alts||[]).forEach(sr)});
  (pl.marks||[]).forEach(m=>{m.x=r1(m.x*k);if(m.type==='zone')m.w=r1(m.w*k)});
}
// a real line has length; a single dot on the player (from an accidental tap) does not count
function hasLine(r){if(!r||!r.pts||!r.pts.length)return false;if(r.end==='zone')return true;   // a zone counts even when it sits right at the player
  let x=0,y=0,l=0;r.pts.forEach(q=>{l+=Math.hypot(q.x-x,q.y-y);x=q.x;y=q.y});return l>=0.6}
// a player who only has alternatives gets the first one as his route (otherwise he stands still when the play runs)
function fixRoutes(pb){let n=0;
  pb.plays.forEach(pl=>[...(pl.players||[]),...(pl.opp||[])].forEach(p=>{
    if(p.route&&!hasLine(p.route)){p.route=null;n++}
    if(p.alts&&p.alts.length){const k=p.alts.length;p.alts=p.alts.filter(hasLine);if(p.alts.length!==k)n++}
    // no main route left, but a solid "alternative" (e.g. after the main route was deleted): that line is the main route
    if(!hasLine(p.route)&&p.alts&&p.alts.length&&p.alts[0].style!=='dotted'){p.route=p.alts.shift();n++}
  }));
  return n>0;
}

function migrateFlag(pb){
  const fixed=fixRoutes(pb);
  if(pb.variant!=='flag5'||pb.fieldV===FLAG_V)return fixed;
  if(pb.variant!=='flag5'||pb.fieldV===FLAG_V)return false;
  pb.plays.forEach(pl=>scalePlayX(pl,FLAG_K));pb.fieldV=FLAG_V;return true;
}

const TRASH_KEY='pbb-trash',TRASH_DAYS=30;
const Trash={items:[],
  load(){try{this.items=JSON.parse(localStorage.getItem(TRASH_KEY)||'[]')}catch(e){this.items=[]}if(!Array.isArray(this.items))this.items=[];this.purge()},
  save(){try{localStorage.setItem(TRASH_KEY,JSON.stringify(this.items))}catch(e){}if(Folder.active())schedule('folder',()=>Folder.flush(),1000)},
  purge(){const lim=Date.now()-TRASH_DAYS*864e5;this.items=this.items.filter(i=>i&&i.at>lim)},
  add(item){item.id=uid('t');item.at=Date.now();this.items.unshift(item);this.purge();this.save()},
  merge(list){(list||[]).forEach(i=>{if(i&&i.id&&!this.items.find(x=>x.id===i.id))this.items.push(i)});this.items.sort((a,b)=>b.at-a.at);this.purge();try{localStorage.setItem(TRASH_KEY,JSON.stringify(this.items))}catch(e){}}
};

      <button class="btn sm primary" data-trest="${i.id}">Wiederherstellen</button><button class="btn sm danger" data-tdel="${i.id}" title="Endgültig löschen">✕</button></div>`;
  const body=()=>Trash.items.length?Trash.items.map(row).join(''):'<p class="hint">Der Papierkorb ist leer.</p>';
  const r=modal('Papierkorb',`<p class="hint" style="margin-top:0">Gelöschte Plays und Playbooks bleiben hier ${TRASH_DAYS} Tage, danach werden sie automatisch entfernt.</p><div id="trashList">${body()}</div>`,
    [{label:'Papierkorb leeren',keep:true,cls:'danger',onClick:async el=>{if(!Trash.items.length)return;Trash.items=[];Trash.save();el.querySelector('#trashList').innerHTML=body();renderSide()}},
     {label:'Schließen',value:null,cls:'primary'}]);
  const back=[...document.querySelectorAll('.mback')].pop();
  back.addEventListener('click',async e=>{
    const rs=e.target.closest('[data-trest]'),dl=e.target.closest('[data-tdel]');

const normTask=t=>String(t||'').toLowerCase().replace(/mitte/g,'middle').replace(/½/g,'1/2').replace(/⅓/g,'1/3').replace(/¼/g,'1/4').replace(/\s+/g,' ').trim();
function taskOptions(pb){

  const base=[...base0,...(pb.tpls||[]).map(t=>t.n).filter(n=>!base0.some(b=>normTask(b)===normTask(n)))];
  const used=new Set();pb.plays.forEach(pl=>pl.players.forEach(p=>[p.route,...(p.alts||[])].forEach(r=>{if(r&&r.task)used.add(r.task)})));

function taskOf(pl,p){

// ---- suggest task names for lines that have none (coach checks them afterwards) ----
function suggestTask(pb,pl,p,r,deepCount){
  if(!r||!hasLine(r))return null;

  const L=r.pts[r.pts.length-1];
  const own=ownTplMatch(pb,p,r);if(own)return own;
  if(pb.type==='defense'){
    if(r.end==='zone'){const cx=p.x+L.x,depth=-(p.y+L.y);
      if(depth>=9){if(deepCount>=4)return 'Deep ¼';if(deepCount===3)return 'Deep ⅓';if(deepCount===2)return Math.abs(cx)<6&&r!==p.route?'Deep Middle':'Deep ½';return 'Deep Middle'}

    return null}
  if(r.end==='block')return (p.label||'').toUpperCase()==='QB'?null:'Block';

  const rs=(pts,n)=>{const a=[[0,0],...pts];let len=0;const seg=[];for(let i=1;i<a.length;i++){const d=Math.hypot(a[i][0]-a[i-1][0],a[i][1]-a[i-1][1]);seg.push(d);len+=d}
    if(len<0.5)return null;const out=[];for(let k=0;k<n;k++){let t=len*k/(n-1),i=0;while(i<seg.length-1&&t>seg[i]){t-=seg[i];i++}const u=seg[i]?Math.min(1,t/seg[i]):0;
      out.push([a[i][0]+(a[i+1][0]-a[i][0])*u,a[i][1]+(a[i+1][1]-a[i][1])*u])}return {out,len}};

  let best=null;

    let dn=0,da=0;for(let k=0;k<14;k++){dn+=Math.hypot(mine.out[k][0]/mine.len-tp.out[k][0]/tp.len,mine.out[k][1]/mine.len-tp.out[k][1]/tp.len);da+=Math.hypot(mine.out[k][0]-tp.out[k][0],mine.out[k][1]-tp.out[k][1])}

function tplSx(p){return p.x>=0.01?1:(p.x<=-0.01?-1:1)}

function suggestTasks(pb){const changed=[];

function strongSide(pb,pl){const off=pb.type==='defense'?(pl.opp||[]):pl.players;   // more opponents on one side = strong side; equal = right

// zone defenders react to receivers: when a receiver runs through his zone he goes with him (inside the zone, a step deeper);
// when the receiver leaves the zone he lets him go (the next zone takes him over) and returns to his spot / the next receiver
function zoneReact(M,defs,recs){
  const Z=defs.map(p=>({p,k:M.tr[p.id]})).filter(z=>z.k&&z.k.r&&z.k.r.end==='zone'&&z.k.rt.length>1);
  const R=recs.filter(o=>{const k=M.tr[o.id];return k&&(k.rl>0.5||k.ml>0.5)});
  if(!Z.length||!R.length)return;
  const dt=1/30,n=Math.ceil((M.total+0.05)/dt)+1;
  Z.forEach(z=>{const r=z.k.r,c=z.k.rt[z.k.rt.length-1],a=(r.zw||7.6)/2*S,b=(r.zh||4.4)/2*S,deep=(z.p.y<=0?-1:1)*S*1.2;
    const reach=z.k.d+z.k.rl/(M.vr*z.k.f),sp=M.vr*1.5;z.c=c;z.a=a;z.b=b;z.deep=deep;z.reach=reach;z.sp=sp;z.zs=[];z.cur=null;z.lock=null});
  for(let i=0;i<n;i++){const t=i*dt,f=animAt(M,t),t2=t-M.T1-M.gap;
    Z.forEach(z=>{const base=f.pos[z.p.id];
      if(t2<z.reach||!z.cur){z.cur=base.slice();z.zs.push(z.cur.slice());return}
      const inZ=q=>{const dx=(q[0]-z.c[0])/z.a,dy=(q[1]-z.c[1])/z.b;return dx*dx+dy*dy<=1.15};
      if(z.lock&&!(f.pos[z.lock]&&inZ(f.pos[z.lock])))z.lock=null;   // receiver left the zone: hand him over
      if(!z.lock){let best=null,bd=1e9;R.forEach(o=>{const q=f.pos[o.id];if(q&&inZ(q)){const d=Math.hypot(q[0]-z.cur[0],q[1]-z.cur[1]);if(d<bd){bd=d;best=o.id}}});z.lock=best}
      let g=base;if(z.lock){const q=f.pos[z.lock];g=[q[0],q[1]+z.deep];let dx=(g[0]-z.c[0])/z.a,dy=(g[1]-z.c[1])/z.b,e=Math.sqrt(dx*dx+dy*dy);if(e>1){g=[z.c[0]+dx/e*z.a,z.c[1]+dy/e*z.b]}}

function animAt(M,t){
  const pos={};const t2=t-M.T1-M.gap;
  for(const id in M.tr){const k=M.tr[id];pos[id]=t<M.T1+M.gap&&!(k.ml>0.5&&t>=M.T1)?along(k.mot,Math.max(0,Math.min((t-(k.ms||0))*M.vm,k.ml))):routePos(M,k,t2)}
  for(const id in M.tr){const k=M.tr[id];if(!k.man)continue;const tp=pos[k.man.to];if(!tp)continue;
    const m=k.man;if(m.still){pos[id]=k.b;continue}
    const ts=m.mot?t:t-M.T1-M.gap-m.d0;if(ts<=0){pos[id]=k.b;continue}   // wait until his man starts moving
    const g=[tp[0]+m.off[0],tp[1]+m.off[1]],d=ts*m.sp;
    if(d<m.pl){pos[id]=along(m.path,d);continue}   // first along the drawn way
    const pe=m.path[m.path.length-1],u=Math.min(1,(d-m.pl)/m.rest);   // then onto the receiver and stay with him
    pos[id]=[pe[0]+(g[0]-pe[0])*u,pe[1]+(g[1]-pe[1])*u]}
  for(const id in M.tr){const k=M.tr[id];if(!k.zs)continue;const u=Math.max(0,t/k.zdt),i=Math.min(k.zs.length-1,Math.floor(u)),j=Math.min(k.zs.length-1,i+1),w=u-i;pos[id]=[k.zs[i][0]+(k.zs[j][0]-k.zs[i][0])*w,k.zs[i][1]+(k.zs[j][1]-k.zs[i][1])*w]}
  let ball=null,bs=1;const B=M.ball;const mix=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];
  if(B){const q=pos[B.qb],cp=B.c&&pos[B.c];
    const hold=p=>[p[0]+9,p[1]+7];   // carried next to the player so the label stays readable
    if(t2<0)ball=hold(cp||q);
    else if(B.snap&&t2<B.snap.t){const r=pos[B.snap.to]||q;ball=t2<0.18&&cp?hold(mix(cp,r,t2/0.18)):t2<B.snap.t-0.15?hold(r):hold(mix(r,q,(t2-B.snap.t+0.15)/0.15))}   // snap to the back, then to the QB
    else if(t2<0.18&&cp)ball=hold(mix(cp,q,t2/0.18));
    else if((B.fakes||[]).some(f=>t2>f.t-0.2&&t2<f.t+0.25)&&(!B.to||t2<B.rel)){const f=B.fakes.find(f=>t2>f.t-0.2&&t2<f.t+0.25);const u=(t2-f.t+0.2)/0.45,w=0.6*Math.sin(Math.PI*u),r=pos[f.to]||q;ball=mix(hold(q),hold(r),w)}   // fake: towards the runner and back
    else if(!B.to||t2<B.rel)ball=hold(q);
    else if(t2<B.arr){const u=(t2-B.rel)/(B.arr-B.rel);ball=mix(hold(routePos(M,M.tr[B.qb],B.rel)),hold(routePos(M,M.tr[B.to],B.arr)),u);bs=B.hand?1:1+0.7*Math.sin(Math.PI*u)}
    else ball=hold(pos[B.to]);}
  return {pos,ball,bs};
}

function startAnim(){if(quizHidden())return toast('Erst 👁 Aufdecken – dann kannst du das Play abspielen.');
  const pb=curPb(),pl=curPlay();const M=animModel(pb,pl,state.animOpt||0);
  if(!M){toast('Keine Routen zum Abspielen.');return}
  state.sel=null;state.multi=[];state.drawing=null;state.quizShown=true;
  state.anim={M,t:0,playing:true,done:false,rate:state.animRate||1,pos:{},ball:null,bs:1,raf:0,last:performance.now()};
  animFrame(0);animUI();renderInsp();
  const step=now=>{
    const a=state.anim;if(!a)return;const dt=Math.min(0.1,(now-a.last)/1000);a.last=now;
    if(a.playing){a.t=Math.min(M.total+0.05,a.t+dt*a.rate);animFrame(a.t);
      if(a.t>=M.total+0.05){a.done=true;a.playing=false;animUI()}}   // stay at the end until sent back
    a.raf=requestAnimationFrame(step);
  };
  state.anim.raf=requestAnimationFrame(step);

// small GIF89a encoder: palette = the 255 most frequent colours of the play, unchanged pixels are transparent so files stay small
function gifWriter(W,H,samples){
  const cnt=new Map();samples.forEach(d=>{for(let j=0;j<d.length;j+=4){const k=(d[j]>>3)<<10|(d[j+1]>>3)<<5|(d[j+2]>>3);cnt.set(k,(cnt.get(k)||0)+1)}});
  const top=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).slice(0,255).map(e=>e[0]);
  const pal=top.map(k=>[((k>>10)&31)*8+4,((k>>5)&31)*8+4,(k&31)*8+4]);
  const near=new Map(top.map((k,i)=>[k,i]));
  const find=(r,g,b)=>{const k=(r>>3)<<10|(g>>3)<<5|(b>>3);let v=near.get(k);if(v!==undefined)return v;
    let best=0,bd=1e9;for(let i=0;i<pal.length;i++){const p=pal[i],d=(p[0]-r)*(p[0]-r)+(p[1]-g)*(p[1]-g)+(p[2]-b)*(p[2]-b);if(d<bd){bd=d;best=i}}near.set(k,best);return best};
  const out=[];const w16=v=>{out.push(v&255,(v>>8)&255)};
  'GIF89a'.split('').forEach(c=>out.push(c.charCodeAt(0)));w16(W);w16(H);out.push(0xF7,0,0);
  for(let i=0;i<256;i++){const c=pal[i]||[0,0,0];out.push(c[0],c[1],c[2])}
  out.push(0x21,0xFF,0x0B);'NETSCAPE2.0'.split('').forEach(c=>out.push(c.charCodeAt(0)));out.push(3,1,0,0,0);
  let prev=null;const N=W*H;
  return {
    frame(rgba,delay){
      const idx=new Uint8Array(N),px=new Uint8Array(N);
      for(let i=0,j=0;i<N;i++,j+=4){const c=find(rgba[j],rgba[j+1],rgba[j+2]);idx[i]=c;px[i]=prev&&prev[i]===c?255:c}
      const first=!prev;prev=idx;
      out.push(0x21,0xF9,4,first?0x04:0x05);w16(delay);out.push(255,0);
      out.push(0x2C);w16(0);w16(0);w16(W);w16(H);out.push(0,8);
      // LZW
      const buf=[];let cur=0,bits=0,size=9,next=258,dict=new Map();
      const emit=c=>{cur|=c<<bits;bits+=size;while(bits>=8){buf.push(cur&255);cur>>>=8;bits-=8}};
      emit(256);let pre=px[0];
      for(let i=1;i<N;i++){const k=px[i],key=pre<<8|k,v=dict.get(key);
        if(v!==undefined)pre=v;
        else{emit(pre);if(next===4096){emit(256);next=258;size=9;dict=new Map()}else{if(next>=(1<<size))size++;dict.set(key,next++)}pre=k}}
      emit(pre);emit(257);if(bits>0)buf.push(cur&255);
      for(let i=0;i<buf.length;i+=255){const n=Math.min(255,buf.length-i);out.push(n);for(let j=0;j<n;j++)out.push(buf[i+j])}
      out.push(0);
    },
    end(){out.push(0x3B);return new Uint8Array(out)}
  };
}

function modal(title,body,buttons,opts={}){
  return new Promise(res=>{
    const back=document.createElement('div');back.className='mback'+(opts.sticky?' sticky':'');
    back.innerHTML=`<div class="modal" role="dialog">${opts.x?'<button type="button" class="mx" aria-label="Schließen" title="Schließen">✕</button>':''}<h3>${esc(title)}</h3><div class="mbody">${body}</div><div class="mbtns">${buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    document.body.appendChild(back);
    const close=v=>{back.remove();res(v)};
    back.addEventListener('click',e=>{if((e.target===back&&PD.t===back&&!opts.sticky)||e.target.closest('.mx'))return close({value:null,el:back});const b=e.target.closest('.mbtns button');
      if(b){const bt=buttons[+b.dataset.i];if(bt.keep){bt.onClick&&bt.onClick(back);return}const out={value:bt.value,el:back};
        if(bt.validate&&!bt.validate(back))return;close(out)}});
    back.addEventListener('keydown',e=>{if(e.key==='Escape'&&!opts.sticky)close({value:null,el:back})});
    const f=back.querySelector('input,textarea,select');if(f)setTimeout(()=>f.focus({preventScroll:true}),30);
    if(opts.onOpen)opts.onOpen(back);
  });
}

function richRuns(t,bold){const out=[];let bb=false,i=false,u=false,cur='';const push=()=>{if(cur)out.push({t:cur,b:!!bold||bb,i,u});cur=''};
  for(let k=0;k<t.length;k++){const two=t.substr(k,2);
    if(two==='**'){push();bb=!bb;k++;continue}
    if(two==='__'){push();u=!u;k++;continue}
    if(t[k]==='*'){push();i=!i;continue}
    cur+=t[k]}
  push();return out}

function richWrap(t,size,maxW,bold){const runs=richRuns(t,bold),words=[];let w=[];
  runs.forEach(r=>r.t.split(/( +)/).forEach(part=>{if(!part)return;if(/^ +$/.test(part)){if(w.length)words.push(w);w=[];return}w.push({...r,t:part})}));

  const ww=x=>x.reduce((n,r)=>n+pdfW(r.t,size,r.b),0),sp=pdfW(' ',size,false),lines=[];let line=[],lw=0;
  words.forEach(x=>{const n=ww(x);if(line.length&&lw+sp+n>maxW){lines.push(line);line=[];lw=0}if(line.length){line.push({sp:true});lw+=sp}line.push(...x);lw+=n});
  if(line.length)lines.push(line);return lines}
function richLine(p,x,y,line,size,col){line.forEach((r,k)=>{

function importFlagPlay(j){
  const U=14.4,C=180; // FlagPlay canonical space: 360 units = 25 yards field width, y=0 is the LOS

  const sty=x=>x==='dashed'?'dashed':x==='dotted'?'dotted':'solid';
  const shp=x=>x==='square'?'square':/tri/i.test(x||'')?'tri':'circle';
  const books=j.playbooks.length?j.playbooks:[{id:null,name:'FlagPlay Import'}];
  let made=null,count=0,skipped=0;
  books.forEach(b=>{
    const plays=j.plays.filter(p=>books.length===1||p.playbookId===b.id).sort((a,c)=>(a.order??0)-(c.order??0));
    if(!plays.length)return;
    const type=plays.filter(p=>p.side==='defense').length>plays.length/2?'defense':'offense';
    const pb={id:uid('pb'),name:b.name||'FlagPlay Import',type,variant:'flag5',created:Date.now(),plays:[]};
    plays.forEach(fp=>{
      const conv=(fp.players||[]).map(q=>{const [x,y]=pt(q.x,q.y);const white=!q.color||/^#?f{3}(f{3})?$/i.test(q.color);
        const o={id:uid('p'),label:String(q.label||'').slice(0,3),x,y,shape:shp(q.symbol),color:q.strokeColor||INK,read:0,route:null,motion:null,alts:[]};
        if(!white)o.fill=q.color;return {fid:q.id,side:q.side||type,o}});
      const byId={};conv.forEach(c=>byId[c.fid]=c.o);
      (fp.routes||[]).slice().sort((a,c)=>(a.priority||0)-(c.priority||0)).forEach(r=>{
        const p=byId[r.playerId];if(!p||!r.points||!r.points.length){skipped++;return}
        const pts=r.points.map(q=>{const [x,y]=pt(q.x,q.y);return {x:r1(x-p.x),y:r1(y-p.y)}});
        if(r.preSnap){p.motion={pts,curve:!!r.curved};return}
        const R={pts,style:sty(r.lineStyle),end:cap(r.capType||''),curve:!!r.curved};if(r.color)R.color=r.color;
        if(!p.route)p.route=R;else p.alts.push(R);
      });
      const marks=[];
      (fp.zones||[]).forEach(z=>marks.push({id:uid('m'),type:'zone',x:r1((z.x-C)/U),y:r1(-(z.y+z.h)/U),w:r1(z.w/U),h:r1(z.h/U),
        rx:Math.min(99,(z.rx||0)/U),color:z.color||'#ef4444',opacity:z.opacity??0.2,dashed:z.borderStyle==='dashed',border:z.borderStyle!=='none'}));
      (fp.annotations||[]).forEach(a=>{
        if(typeof a.text==='string'&&a.text){const sz=r1(Math.min(2,(a.fontSize||24)/U)),v=VAR.flag5;/* call name: top right corner like a title */
          marks.push({id:uid('m'),type:'text',x:r1(Math.max(-v.W/2+0.5,v.W/2-0.6-a.text.length*sz*0.62)),y:r1(-v.up+sz/2+0.4),text:a.text,size:sz,color:a.color||INK})}
        else if(a.shape==='bolt'){const [x,y]=pt(a.x,a.y);marks.push({id:uid('m'),type:'bolt',x,y,size:r1((a.size||20)/U),rot:a.rotation||0,color:a.color||'#f97316'})}
        else skipped++;
      });
      const ft=(fp.annotations||[]).find(a=>a.text);
      pb.plays.push({id:uid('pl'),name:fp.name||'Play',cat:ft?ft.text:'',formation:'',notes:[fp.notes,(fp.tags||[]).join(', ')].filter(Boolean).join('\n'),
        players:conv.filter(c=>c.side===type).map(c=>c.o),opp:conv.filter(c=>c.side!==type).map(c=>c.o),oppForm:'',showOpp:true,marks,updated:Date.now()});
      count++;
    });
    pb.plays=pb.plays.map(pl=>cleanPlay(pl,false));migrateFlag(pb);state.pbs.push(pb);Store.savePb(pb);pb.plays.forEach(pl=>Store.savePlay(pb,pl));made=made||pb;
  });
  if(!made)return importError('In der FlagPlay-Datei wurden keine Plays gefunden.');
  selectPb(made.id);toast(`${count} Plays aus FlagPlay importiert`+(skipped?` (${skipped} Elemente übersprungen)`:''));
}
async function doImport(text){if(needLogin())return accountDialog();if(teamPlayer())return toast('Als Spieler kannst du nichts importieren.');
  if(typeof text!=='string'||!text.trim())return importError('Die Datei ist leer.');
  if(text.length>20e6)return importError('Die Datei ist zu groß (über 20 MB) – das ist keine Playbook-Datei.');
  let j;try{j=JSON.parse(text)}catch(e){return importError('Die Datei ist keine Playbook-Datei oder beschädigt (kein gültiges JSON).')}
  try{
    if(j&&!j.app&&Array.isArray(j.plays)&&Array.isArray(j.playbooks))return importFlagPlay(j);
    if(!j||typeof j!=='object'||j.app!=='playbook-builder')return importError('Das ist keine Datei aus dem Playbook Builder. Erwartet wird eine Datei, die über „Playbook teilen“, „Teilen“ oder „Alles sichern“ gespeichert wurde.');
    const prep=src=>{const pb=cleanPb(src,true);if(!pb.fieldV&&(j.fieldV===FLAG_V||src.fieldV===FLAG_V))pb.fieldV=FLAG_V;migrateFlag(pb);return pb};
    if(Array.isArray(j.playbooks)){   // backup of everything
      const list=j.playbooks.slice(0,200).map(prep);if(!list.length)return importError('Die Sicherung enthält keine Playbooks.');
      const known=list.filter(pb=>state.pbs.some(x=>x.id===pb.id)).length;
      const r=await modal('Sicherung einspielen',`<p>Die Datei enthält <b>${list.length} ${list.length===1?'Playbook':'Playbooks'}</b> mit zusammen ${list.reduce((n,pb)=>n+pb.plays.length,0)} Plays.</p>
        <ul><li>${known} davon hast du schon – dort werden nur <b>neuere</b> Plays übernommen und fehlende ergänzt.</li><li>${list.length-known} ${list.length-known===1?'kommt':'kommen'} neu dazu.</li></ul><p class="hint">Es wird nichts gelöscht.</p>`,
        [{label:'Abbrechen',value:null},{label:'Einspielen',value:'ok',cls:'primary'}]);
      if(r.value!=='ok')return;
      let add=0,upd=0;list.forEach(pb=>{const ex=state.pbs.find(x=>x.id===pb.id);
        if(!ex){state.pbs.push(pb);Store.savePb(pb);pb.plays.forEach(pl=>Store.savePlay(pb,pl));add+=pb.plays.length}
        else{const m=mergePlays(ex,pb.plays);add+=m.add;upd+=m.upd}});
      if(!curPb()&&state.pbs[0])selectPb(state.pbs[0].id);else renderAll();
      return toast(`Sicherung eingespielt: ${add} neue, ${upd} aktualisierte Plays`);

      if(!VAR[j.variant])return importError('Unbekannte Spielvariante in der Datei.');
      if(j.variant!==pb.variant||j.type!==pb.type)return importError(`Dieses Play gehört in ein ${j.type==='defense'?'Defense':'Offense'}-Playbook (${VAR[j.variant].name}). Wähle oben links ein passendes Playbook und importiere erneut.`);
      const pl=cleanPlay(j.play,false);if(pb.variant==='flag5'&&j.fieldV!==FLAG_V)scalePlayX(pl,FLAG_K);pb.plays.push(pl);Store.savePlay(pb,pl);Store.savePb(pb);selectPlay(pl.id);toast('Play importiert');
    } else importError('In der Datei wurden keine Plays gefunden.');
  }catch(e){console.warn(e);importError((e&&e.message)||'Die Datei konnte nicht gelesen werden.')}
}
// newer version of a play wins, unknown plays are added, nothing is removed
function mergePlays(pb,plays){
  let add=0,upd=0,same=0;
  plays.forEach(pl=>{const i=pb.plays.findIndex(x=>x.id===pl.id);
    // the imported play keeps its own time stamp (saving would set "now"), so a later, newer file still counts as newer
    const keep=p=>{const u=p.updated;Store.savePlay(pb,p);if(u)p.updated=u};
    if(i<0){pb.plays.push(pl);keep(pl);add++}
    // a newer version replaces the old one – also locked plays (the import is chosen on purpose); the lock stays
    else if((pl.updated||0)>(pb.plays[i].updated||0)){Hist.push(pb.plays[i],true);if(pb.plays[i].locked)pl.locked=true;pb.plays[i]=pl;keep(pl);upd++}
    else same++});
  Store.savePb(pb);return {add,upd,same};
}

function cleanBlock(b){if(!b||typeof b!=='object')return null;return {id:cStr(b.id,40)||uid('b'),t:cStr(b.t,80),min:Math.round(cNum(b.min,10,0,300)),d:cStr(b.d,1500),mat:cStr(b.mat,200),dr:cStr(b.dr,40),

/* ---------- push notifications: the team's push service (Cloudflare Worker) sends them; it only gets the sign-in token, never data ---------- */
const Push={
  on(){return !!PUSH_URL&&HOSTED},
  can(){return this.on()&&PWA&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window},
  needInstall(){return IOS&&!STANDALONE},
  async call(path,body){const r=await fetch(PUSH_URL+path,{method:'POST',headers:{'Authorization':'Bearer '+await Sync.token(),'Content-Type':'application/json'},body:JSON.stringify(body||{})});
    const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||('HTTP '+r.status));e.status=r.status;throw e}return j},
  async sub(){if(!this.can())return null;const reg=await navigator.serviceWorker.getRegistration();return reg?reg.pushManager.getSubscription():null},
  async enable(prefs){if(await Notification.requestPermission()!=='granted'){const e=new Error('denied');e.denied=true;throw e}
    const reg=await navigator.serviceWorker.ready;let s=await reg.pushManager.getSubscription();
    if(!s){const k=await (await fetch(PUSH_URL+'/key')).json();if(!k.key)throw new Error(k.error||'Push-Dienst nicht bereit');
      const raw=Uint8Array.from(atob(k.key.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((k.key.length+3)%4)),c=>c.charCodeAt(0));
      s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:raw})}
    return this.call('/sub',{sub:s.toJSON(),prefs})},
  async disable(){const s=await this.sub().catch(()=>null);if(!s)return;await this.call('/unsub',{endpoint:s.endpoint}).catch(()=>{});await s.unsubscribe().catch(()=>{})},
  // tells the push service what happened; it checks with the sender's rights and picks the recipients itself
  notify(kind,id,x){if(!this.on()||!Sync.user||!id)return Promise.resolve();return this.call('/notify',{...(x||{}),kind,id}).catch(e=>console.warn('push',e))}
};

function keepTasks(pl,src){let n=0;
  const same=(a,b)=>a&&b&&a.pts.length===b.pts.length&&a.pts.every((q,i)=>Math.abs(q.x-b.pts[i].x)<0.05&&Math.abs(q.y-b.pts[i].y)<0.05)&&(a.end||'arrow')===(b.end||'arrow');
  pl.players.forEach(p=>{const o=(src.players||[]).find(x=>x.id===p.id)||(src.players||[]).find(x=>x.label===p.label&&Math.abs(x.x-p.x)<0.05&&Math.abs(x.y-p.y)<0.05);if(!o)return;

  return n}

const Snap={at:{},
  day(t=Date.now()){const d=new Date(t);return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')},
  async save(pb){const u=Sync.user,c=pb.cloud;if(!u||!c||!(c.role==='own'||c.role==='edit'))return;
    const now=Date.now(),wait=5*60000-(now-(this.at[pb.id]||0));   // at most every 5 minutes, the last change of a burst follows
    if(wait>0){this.tm=this.tm||{};if(!this.tm[pb.id])this.tm[pb.id]=setTimeout(()=>{delete this.tm[pb.id];const p=state.pbs.find(x=>x.id===pb.id);if(p)this.save(p)},wait);return}
    this.at[pb.id]=now;
    const data=clone(pb);delete data.cloud;data.fmt=2;
    const doc={fields:{pb:{stringValue:pb.id},owner:{stringValue:c.owner||u.uid},editors:{arrayValue:{values:(c.editors||[]).map(v=>({stringValue:v}))}},name:{stringValue:pb.name||''},
      at:{integerValue:String(now)},by:{stringValue:u.email},n:{integerValue:String(pb.plays.length)},data:{stringValue:JSON.stringify(data)}}};
    try{await Sync.req('PATCH','/snapshots/'+encodeURIComponent(pb.id+'_'+this.day(now)),doc)}catch(e){this.at[pb.id]=0;console.warn('snapshot',e)}},
  async list(pb,days=21){const base='projects/'+FIREBASE.projectId+'/databases/(default)/documents/snapshots/';
    const names=[...Array(days)].map((_,i)=>base+pb.id+'_'+this.day(Date.now()-i*864e5));
    const j=await Sync.req('POST',':batchGet',{documents:names,mask:{fieldPaths:['pb','at','by','n','name']}});
    return (Array.isArray(j)?j:[]).filter(x=>x.found).map(x=>{const f=x.found.fields||{};return {id:x.found.name.split('/').pop(),at:+(f.at&&f.at.integerValue||0),by:f.by&&f.by.stringValue||'',n:+(f.n&&f.n.integerValue||0),name:f.name&&f.name.stringValue||''}}).sort((a,b)=>b.at-a.at)},
  async load(id){const j=await Sync.req('GET','/snapshots/'+encodeURIComponent(id));return JSON.parse(j.fields.data.stringValue)}
};

function mergePb(loc,rem){
  const del={...(rem.del||{})};Object.entries(loc.del||{}).forEach(([k,v])=>{if(!del[k]||v>del[k])del[k]=v});
  const map=new Map();[...rem.plays,...loc.plays].forEach(pl=>{const o=map.get(pl.id);if(!o||(pl.updated||0)>(o.updated||0))map.set(pl.id,pl)});
  const order=[...rem.plays.map(p=>p.id),...loc.plays.map(p=>p.id)].filter((id,i,a)=>a.indexOf(id)===i);
  loc.plays=order.map(id=>map.get(id)).filter(pl=>pl&&!(del[pl.id]&&del[pl.id]>=(pl.updated||0)));
  const cut=Date.now()-90*864e5;Object.keys(del).forEach(k=>{if(del[k]<cut)delete del[k]});loc.del=del;
  if((rem.updated||0)>(loc.updated||0)){loc.name=rem.name;if(rem.layoutPlayId)loc.layoutPlayId=rem.layoutPlayId}
  if(rem.book&&(!loc.book||(rem.book.t||0)>(loc.book.t||0)))loc.book=rem.book;
  if(rem.gw&&(!loc.gw||(rem.gw.t||0)>(loc.gw.t||0)))loc.gw=rem.gw;
  const tm=new Map();[...(rem.tpls||[]),...(loc.tpls||[])].forEach(t=>{const o=tm.get(t.id);if(!o||(t.t||0)>(o.t||0))tm.set(t.id,t)});
  const tl=[...tm.values()].filter(t=>!(del['tpl:'+t.id]&&del['tpl:'+t.id]>=(t.t||0)));if(tl.length)loc.tpls=tl;else delete loc.tpls;
}

/* ---------- 🔑 unlock code: instead of the confirmation mail (only the admin in the rules can create one; one use, 7 days) ---------- */
const Inv={
  norm(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'')},
  async check(){const u=Sync.user;if(!u||u.verified)return;
    try{await Sync.req('GET','/unlocked/'+encodeURIComponent(u.uid));u.unlocked=true;u.verified=true;return}catch(e){}
    // the admin asked for a confirmation mail instead of a code: send it now (once) from this account
    const mid='/invites/'+encodeURIComponent('MAIL-'+u.email);
    try{const j=await Sync.req('GET',mid);const f=j.fields||{};if((f.email&&f.email.stringValue)===u.email&&+(f.exp&&f.exp.integerValue||0)>Date.now()){
      await Sync.resendVerify();Sync.req('DELETE',mid).catch(()=>{});toast('📧 Dein Coach hat dir eine Bestätigungs-Mail geschickt – bitte den Link darin öffnen (auch im Spam-Ordner nachsehen).')}}catch(e){}},
  async mail(email){const doc={fields:{email:{stringValue:email.toLowerCase()},owner:{stringValue:Sync.user.uid},exp:{integerValue:String(Date.now()+7*864e5)}}};
    const path='/invites/'+encodeURIComponent('MAIL-'+email.toLowerCase());await Sync.req('DELETE',path).catch(()=>{});   // the rules allow no update, only new
    await Sync.req('PATCH',path,doc,'currentDocument.exists=false')},
  async create(email){const abc='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';const r=crypto.getRandomValues(new Uint32Array(8));r.forEach(x=>c+=abc[x%abc.length]);
    const doc={fields:{email:{stringValue:email.toLowerCase()},owner:{stringValue:Sync.user.uid},exp:{integerValue:String(Date.now()+7*864e5)}}};
    await Sync.req('PATCH','/invites/'+c,doc,'currentDocument.exists=false');return c.slice(0,4)+'-'+c.slice(4)},
  async redeem(code){const u=Sync.user,c=this.norm(code);if(c.length<6)throw new Error('Der Code hat 8 Zeichen, z. B. K7PQ-4QXM.');
    let j;try{j=await Sync.req('GET','/invites/'+c)}catch(e){throw new Error(e.status===404||e.status===403?'Diesen Code gibt es nicht (mehr). Bitte beim Coach einen neuen holen.':e.message)}
    const f=j.fields||{};if((f.email&&f.email.stringValue)!==u.email)throw new Error('Dieser Code gilt für eine andere E-Mail-Adresse. Bist du mit der richtigen Adresse angemeldet?');
    if(+(f.exp&&f.exp.integerValue||0)<Date.now())throw new Error('Der Code ist abgelaufen (7 Tage). Bitte beim Coach einen neuen holen.');
    await Sync.req('PATCH','/unlocked/'+encodeURIComponent(u.uid),{fields:{email:{stringValue:u.email},code:{stringValue:c},at:{integerValue:String(Date.now())}}},'currentDocument.exists=false').catch(e=>{if(e.status!==409&&!/ALREADY_EXISTS/.test(e.message))throw e});
    Sync.req('DELETE','/invites/'+c).catch(()=>{});   // one use only
    u.unlocked=true;u.verified=true}
};

/* ---------- new app version on the server? ask to reload ---------- */
const Upd={last:0,shown:false,snooze:0,snoozed:false,touched:false,
  async check(){
    if(!HOSTED||this.shown||Date.now()<this.snooze||!/^https?:/.test(location.protocol))return;this.last=Date.now();
    let txt;try{const r=await fetch(location.pathname+(location.pathname.endsWith('/')?'':'')+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;txt=await r.text()}catch(e){return}
    const m=/const APP_VERSION='([^']+)'/.exec(txt);if(!m||m[1]===APP_VERSION)return;
    let notes=[];try{const n=/const APP_NOTES=(\[.*?\]);/.exec(txt);if(n)notes=JSON.parse(n[1]).filter(x=>typeof x==='string').slice(0,6)}catch(e){}
    if(!this.touched&&!state.drawing&&!$('.mback')&&!state.present)return this.go(true);   // nothing done yet in this session: just update
    this.show(m[1],notes);
  },
  async go(quiet){if(!quiet)toast('Wird aktualisiert…');flushAll();
    for(let i=0;i<40&&(W.timers.size||W.busy.size);i++)await new Promise(res=>setTimeout(res,150));
    try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}catch(e){}
    location.reload()},
  async show(v,notes){
    const typing=(a=>a&&/^(TEXTAREA|INPUT)$/.test(a.tagName)&&a.value)(document.activeElement)||Object.keys(QDraft).some(k=>k[0]!=='_'&&QDraft[k])||QEdit.k;
    if($('.mback')||state.drag||state.drawing||state.present||typing){setTimeout(()=>this.show(v,notes),20000);return}
    this.shown=true;notes=notesFor(notes);
    let left=30;const p=modal('🔄 Neue Version',`<p style="margin-top:0">Die App lädt sich in <b id="updLeft">${left}</b> Sekunden neu. Deine Playbooks bleiben erhalten.</p>`,
      [...(this.snoozed?[]:[{label:'In 30 Min.',value:null}]),{label:'Jetzt aktualisieren',value:'go',cls:'primary'}]);
    const back=[...document.querySelectorAll('.mback')].pop();
    const r=await Promise.race([p,new Promise(res=>{const iv=setInterval(()=>{left--;const el=back&&back.querySelector('#updLeft');if(el)el.textContent=left;
      if(!back||!back.isConnected){clearInterval(iv);return}if(left<=0){clearInterval(iv);back.remove();res({value:'go'})}},1000)})]);
    if(r.value!=='go'){this.shown=false;this.snoozed=true;this.snooze=Date.now()+30*60000;setTimeout(()=>this.check(),30*60000+1000);return}   // only once – next time it updates
    this.go();
  }
};

let crashAt=0;
function crash(err){
  const msg=String((err&&(err.stack||err.message))||err||'');
  if(!msg||/ResizeObserver|Script error|AbortError|NotAllowedError|The user aborted|play\(\) request/i.test(msg))return;
  console.error(err);
  try{if(state.anim){cancelAnimationFrame(state.anim.raf);state.anim=null}state.drag=null;state.drawing=null;flushAll()}catch(e){}
  if(Date.now()-crashAt<30000||$('.mback'))return;crashAt=Date.now();
  modal('Etwas ist schiefgelaufen',`<p>In der App ist ein unerwarteter Fehler aufgetreten. Deine Playbooks sind gespeichert.</p>

    <details><summary class="hint">Technische Details</summary><pre style="white-space:pre-wrap;font-size:11px;max-height:120px;overflow:auto">${esc(msg.slice(0,600))}</pre></details>`,
    [{label:'Neu laden',value:'reload'},{label:'Fehler melden',value:'report'},{label:'Weiterarbeiten',value:null,cls:'primary'}]).then(r=>{
      if(r.value==='reload')location.reload();

}

function toPngBlob(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),'image/png')};img.onerror=rej;img.src=u})}
/* ---------- laser pointer for presenting: glowing red dot with a short fading trail ---------- */
const Laser={on:false,cv:null,ctx:null,pts:[],raf:0,
  toggle(v){this.on=v===undefined?!this.on:v;
    if(this.on){if(!this.cv){const c=document.createElement('canvas');c.id='laser';document.body.appendChild(c);this.cv=c;this.ctx=c.getContext('2d');
        addEventListener('resize',()=>this.size());addEventListener('pointermove',e=>this.move(e),{passive:true})}
      this.size();this.cv.style.display='block';document.body.classList.add('lasering');toast('🔴 Laserpointer an – Esc oder L zum Beenden');}
    else{if(this.cv)this.cv.style.display='none';document.body.classList.remove('lasering');this.pts=[];}
    const b=$('.laserbtn');if(b)b.classList.toggle('on',this.on);
  },
  size(){const d=devicePixelRatio||1;this.cv.width=innerWidth*d;this.cv.height=innerHeight*d;this.ctx.setTransform(d,0,0,d,0,0)},
  move(e){if(!this.on)return;this.pts.push({x:e.clientX,y:e.clientY,t:performance.now()});if(!this.raf)this.raf=requestAnimationFrame(()=>this.draw())},
  draw(){this.raf=0;const c=this.ctx,now=performance.now(),LIFE=450;
    this.pts=this.pts.filter(p=>now-p.t<LIFE);c.clearRect(0,0,innerWidth,innerHeight);if(!this.on)return;
    c.lineCap='round';c.lineJoin='round';
    for(let i=1;i<this.pts.length;i++){const a=this.pts[i-1],b=this.pts[i],k=1-(now-b.t)/LIFE;
      c.strokeStyle=`rgba(255,30,30,${0.55*k})`;c.lineWidth=2+6*k;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();}
    const h=this.pts[this.pts.length-1];
    if(h){const g=c.createRadialGradient(h.x,h.y,0,h.x,h.y,16);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,40,40,1)');g.addColorStop(1,'rgba(255,0,0,0)');
      c.fillStyle=g;c.beginPath();c.arc(h.x,h.y,16,0,Math.PI*2);c.fill();this.last=h}
    if(this.pts.length>1)this.raf=requestAnimationFrame(()=>this.draw());
    else if(this.last){const L=this.last,g=c.createRadialGradient(L.x,L.y,0,L.x,L.y,16);g.addColorStop(0,'#fff');g.addColorStop(.25,'rgba(255,40,40,1)');g.addColorStop(1,'rgba(255,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(L.x,L.y,16,0,Math.PI*2);c.fill()}
  }
};

    <li><b>📝 Notizen:</b> Zeigt die Notizen des Coaches (beim Lernen erst nach dem Aufdecken). Dort kannst du auch eine <b>Frage zum Play</b> an deinen Coach schreiben – seine Antwort siehst du an derselben Stelle. Auf eine Antwort kannst du direkt nachfragen oder mit 👍 reagieren.</li>
    <li><b>👤 Konto</b> (oben rechts): abmelden. Dein Coach sieht, wie lange du gelernt hast und wie gut es lief.</li></ul></details>
    <details class="hsec"><summary>🎓 Lernen</summary><ul>
    <li><b>🎓 Lernen – Plays:</b> Die Aufgaben sind verdeckt. Tippe einen Spieler auf dem Feld an und wähle links seine Aufgabe (z. B. „Slant“, „Deep ½“). Bei <b>Man</b> tippst du danach den Gegenspieler an, den er deckt. Wenn alle beantwortet sind: <b>👁 Aufdecken</b> – grün ist richtig, rot falsch.</li>
    <li><b>🎓 Lernen – Formations:</b> Oben auf „Formations“ umschalten und den richtigen Namen der gezeigten Formation antippen.</li>
    <li>Beim Lernen kommen die Plays und Formations immer <b>gemischt</b> – jedes einmal. Am Ende der Runde kannst du die <b>falschen nochmal</b> üben oder eine neue Runde starten.</li>
    <li><b>Abspielen</b> geht beim Lernen erst nach dem Aufdecken. Gezählt wird pro Play der <b>erste Versuch am Tag</b> – danach kannst du beliebig üben.</li></ul></details>
    <details class="hsec"><summary>📅 Kalender &amp; 🗓 Game Week</summary><ul>
    <li><b>📅 Kalender</b> (Reiter oben): alle Spiele, Turniere und Termine deines Teams – H = Heimspiel, A = Auswärts. Antippen zeigt Ort, Zeit und Infos.</li>
    <li><b>🗓 Game Week:</b> Vor einem Spiel legt dein Coach eine Game Week für den Gegner an – mit den wichtigsten Plays und Infos zum Gegner. Du findest sie oben in der Auswahl; alle anderen Playbooks kannst du weiter lernen.</li></ul></details>
    <details class="hsec"><summary>📋 Practice Plan</summary><ul>
    <li>Hat dein Coach für ein Training einen <b>Practice Plan</b> gemacht, steht er im 📅 Kalender beim Termin (📋 statt 📌): alle Blöcke mit Uhrzeit, Beschreibung und Material. 🏈-Plays darin antippen öffnet das Play.</li></ul></details>
    <details class="hsec"><summary>🎬 Film</summary><ul>
    <li>Im Reiter <b>🎬</b> oben zeigt dein Coach kurze <b>Spielszenen</b> – zur Nachbesprechung oder zur Vorbereitung auf einen Gegner.</li>
    <li>Antippen spielt den Clip ab. An den <b>Markierungen</b> des Coaches (Pfeile, Kreise, Text) hält er kurz an – oder bis du „▶ weiter“ tippst. ⏮ ⏭ gehen Bild für Bild, ½× / ¼× spielt langsamer.</li>
    <li>Steht eine <b>❓ Frage vom Coach</b> dabei, schreibst du deine Antwort darunter. Du kannst dort auch selbst eine Frage stellen – nur du und die Coaches sehen das.</li>
    <li>👁 Dein Coach sieht, ob und wie lange du einen Clip angeschaut hast.</li></ul></details>
    <details class="hsec"><summary>🔔 Benachrichtigungen</summary><ul>
    ${pushHelp(false)}</ul></details>
    <p class="hint" style="text-align:right;font-size:11px;margin-bottom:0">Version ${APP_VERSION}</p>`,

  modal('So funktioniert’s',`${intro}
    <details class="hsec"><summary>✏️ Plays zeichnen</summary><ul>

    <li><b>🔒</b> sperrt ein Play gegen versehentliche Änderungen (⋯ → alle auf einmal). <b>🔴 Laser</b> (Taste L) zum Zeigen.</li>

    <details class="hsec"><summary>▶ Abspielen, Präsentieren &amp; Lernen</summary><ul>
    <li><b>▶ Abspielen</b> mit Pause, Einzelschritt (⏮ ⏭) und Tempo. Bei Offense-Plays rechts <b>„Ball beim Abspielen“</b>: ein oder zwei Fakes, dann Ball an QB, Read 1 oder einen bestimmten Spieler (Handoff, Pitch, Pass). Run-Plays übergeben automatisch an den RB, eine QB-Linie „Pitch“ wird gepitcht. Unter „Aktionen“ als <b>Video oder GIF</b> speichern.</li>
    <li><b>▣ Präsentation:</b> Vollbild für Meetings – ←/→ wechselt das Play, Leertaste spielt ab, N zeigt Notizen, Esc beendet.</li>
    <li><b>🎓 Lernen</b> (in der Präsentation): Plays (Aufgaben der Spieler) oder Formations (Namen) abfragen – immer gemischt, jedes einmal pro Runde; danach lassen sich die falschen separat wiederholen. Damit das klappt, braucht jede Linie einen Aufgaben-Namen: ⋯ → <b>🎓 Aufgaben vorschlagen</b> und <b>📋 Aufgaben prüfen</b>.</li></ul></details>

    <details class="hsec"><summary>👥 Team, Teilen &amp; Fragen</summary><ul>

    <li><b>Teilen:</b> „Playbook teilen“ – gemeinsam nutzen (Team oder einzelne Personen) oder als Kopie-Datei weitergeben. Rollen: Spieler – lesen / Coach – lesen + Fortschritt / Coach – bearbeiten. <b>🚫 Nicht mehr teilen</b> beendet alle Freigaben. Einzelne Plays mit <b>👥 Mit Team teilen</b> – sie stehen links unter <b>👥 Team-Plays</b>.</li>
    <li><b>💬 Fragen</b> von Spielern erscheinen oben als <b>roter Knopf</b>. Rechts beim Play antworten, nachfragen, mit ✎ ausbessern oder mit 👍 reagieren; „Erledigt“ schließt die Frage. <b>📊 Fortschritt</b> (⋯) zeigt, wie lange und wie gut die Spieler gelernt haben.</li></ul></details>
    <details class="hsec"><summary>📅 Kalender &amp; 🗓 Game Week</summary><ul>

    <li><b>🗓 Game Week:</b> Links <b>☑ Markieren</b>, Plays und Formationen antippen, dann <b>🗓 In Game Week</b> – sie kommen als <b>Kopie</b> in eine Game Week für einen Gegner (eigene für Offense und Defense). Dort kannst du Plays anpassen und den Gegnern Routen geben (laufen beim Abspielen mit; Man bleibt am Mann, Zone übernimmt und übergibt). Mit „✎ Gegner-Infos“ Gegner, Spieltag und Scouting-Notizen eintragen – die sehen auch die Spieler und stehen im Playbook-PDF. „↻ Aus Original neu übernehmen“ holt den aktuellen Stand aus dem Playbook. Nach dem Spiel <b>📦 Archivieren</b>; aus dem Archiv lässt sie sich wieder holen oder mit <b>🔁 Rückspiel</b> neu anlegen.</li></ul></details>
    <details class="hsec"><summary>🏃 Trainings</summary><ul>
    <li><b>＋ Termin → 🏃 Training</b>: Datum, Uhrzeit von–bis, Ort. Unter „Wiederholen“ die Wochentage anhaken (z. B. Mo + Sa) und die Anzahl Wochen – die App legt alle Trainings auf einmal an.</li>
    <li>Ein einzelnes Training ändern: antippen → ✎ Bearbeiten. Bei Uhrzeit, Ort, Titel oder Infos fragt die App, ob auch alle folgenden am selben Wochentag mitgeändert werden sollen.</li>
    <li><b>🚫 Trainingsfrei</b>: Training antippen → „🚫 Trainingsfrei“ (mit Grund, z. B. Ferien). Es bleibt im Kalender, durchgestrichen – „✓ Findet statt“ macht es rückgängig. Oder löschen: nur dieses oder alle folgenden.</li></ul></details>
    <details class="hsec"><summary>📋 Practice Plan</summary><ul>
    <li>Im 📅 Kalender ein Training antippen → <b>📋 Practice Plan</b>. Beginn ist die Uhrzeit des Termins; jeder Block bekommt Minuten (− / + in 5er-Schritten), die Uhrzeiten rechnet die App aus. ↑ ↓ ändern die Reihenfolge.</li>
    <li><b>＋ Übung</b> holt eine Übung aus der <b>Übungs-Bibliothek</b> deines Teams (suchen, nach Kategorie filtern, ✎ bearbeiten) – oder legt mit „＋ Neue Übung“ eine an, die danach immer zur Auswahl steht. Bei „▾ Details“: Beschreibung/Coaching Points, Material und optional Plays.</li>
    <li><b>📚 Vorlagen</b>: einen fertigen Plan als Vorlage speichern und beim nächsten Training laden (ersetzen oder anhängen).</li>
    <li><b>📤 Teilen</b> öffnet am Handy das Teilen-Menü (z. B. WhatsApp an die Coaches) – als Text mit Uhrzeiten, Übungen und Material-Liste. Spieler sehen den Plan in der App beim Termin. Bibliothek und Vorlagen sehen nur Coaches.</li></ul></details>
    <details class="hsec"><summary>🎬 Film</summary><ul>
    <li><b>＋ Clip hochladen</b>: Video vom Handy oder PC wählen, fertige Clips einfach so nehmen – nur bei längeren Videos mit ⟦ / ⟧ den Ausschnitt festlegen (höchstens 40 s), Gegner und „Nachbesprechung“ oder „Vorbereitung“ wählen. Die App macht den Clip klein (ca. 480p, ohne Ton) – dauert so lange wie der Ausschnitt. Am besten in Chrome, Edge oder Safari.</li>
    <li><b>✎ Markieren</b>: an der gewünschten Stelle anhalten, Pfeil, Linie, Kreis, Freihand oder Text zeichnen. Eine Markierung antippen wählt sie aus: verschieben, an den Punkten die Enden ziehen, Farbe ändern, Text mit A− / A+ oder am Griff ⤡ größer und kleiner machen oder mit 🗑 einzeln löschen – der Clip stoppt dort beim Abspielen, bis man tippt (oder nur 2, 3, 5 s). Mehrere Stellen pro Clip möglich.</li>
    <li><b>Frage an die Spieler</b> beim Clip (✎ Bearbeiten). Jeder Spieler antwortet für sich, du siehst alle Antworten beim Clip und kannst jedem antworten. Spieler können dort auch selbst fragen. Neue Antworten zeigt der rote 💬-Punkt.</li>
    <li><b>👁 Angeschaut</b>: Auf jeder Clip-Karte steht, wie viele Spieler ihn angesehen haben (z. B. 👁 7/12). Im Clip unter „👁 Angeschaut“ siehst du pro Spieler, wie lange er das Video angeschaut und wie oft er es geöffnet hat.</li>
    <li><b>Verbinden</b>: Beim Bearbeiten einen Clip mit einem Play oder einem ganzen Game Plan verbinden – er erscheint dann dort rechts unter „🎬 Clips“.</li>
    <li><b>⋯ → 🔔 Team benachrichtigen</b>, wenn neue Clips fertig sind. <b>⋯ → 💾 Auf Gerät sichern</b> lädt Clips mit Markierungen als eine Datei herunter (danach kannst du sie aus der Cloud löschen); <b>📂 Gesicherte Clips laden</b> bringt sie z. B. zum Rückspiel zurück. Kostenlos ist Platz für etwa 1000 MB – pro Sekunde Video braucht ein Clip rund 0,15 MB.</li></ul></details>
    <details class="hsec"><summary>🔔 Benachrichtigungen</summary><ul>
    ${pushHelp(true)}</ul></details>
    <details class="hsec"><summary>🛟 Sicherheit &amp; Speichern</summary><ul>
    <li><b>Sicherheit:</b> 🕘 Verlauf (frühere Stände eines Plays), 🗑 Papierkorb (30 Tage), 🗄 Cloud-Sicherungen (⋯, jeder Tag der letzten 3 Wochen), 💾 Alles sichern (Datei). Ein verbundener <b>📁 Ordner</b> gehört zum Konto, das ihn verbunden hat.</li></ul></details>
