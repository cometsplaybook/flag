/* ---------- event wiring ---------- */
document.addEventListener('click',async e=>{
  const m=e.target.closest('[data-mode]');
  if(m){stopAnim(true);if(state.drawing)finishDrawing();state.mode=m.dataset.mode;
    if((state.mode==='route'||state.mode==='motion')&&state.sel)startDrawing(state.mode,state.sel);
    renderCenter();return}
  const pi=e.target.closest('[data-play]');
  if(pi&&!e.target.closest('[data-a]')){if(state.pick&&pi.closest('#side')){const id=pi.dataset.play;state.pick.has(id)?state.pick.delete(id):state.pick.add(id);return renderSide()}if(pi.dataset.play!==state.playId)selectPlay(pi.dataset.play);return}
  const sw=e.target.closest('[data-color]');
  if(sw){const p=selPlayer();if(p){commit();freezeRouteColors(p);p.color=sw.dataset.color;changed({insp:true})}return}
  const sh=e.target.closest('[data-shape]');if(sh){const p=selPlayer();if(p){commit();p.shape=sh.dataset.shape;changed({insp:true})}return}
  const pf=e.target.closest('[data-pfill]');if(pf){const p=selPlayer();if(p){commit();const c=pf.dataset.pfill;if(c.toLowerCase()==='#ffffff')delete p.fill;else p.fill=c;changed({insp:true})}return}
  const pli=e.target.closest('[data-pline]');if(pli){const p=selPlayer();if(p){commit();freezeRouteColors(p);p.color=pli.dataset.pline;changed({insp:true})}return}
  const rc=e.target.closest('[data-rcolor]');if(rc){const p=selPlayer();const r=p&&getRoute(p,curRouteKey(p));if(r){commit();r.color=rc.dataset.rcolor;changed({insp:true})}return}
  const srb=e.target.closest('[data-selroute]');if(srb){const [k,j]=srb.dataset.selroute.split(':');state.selRoute={k,j:+j};renderField();renderInsp();return}
  const zb=e.target.closest('[data-zborder]');if(zb){const m=findMark(state.sel);if(m){commit();const v=zb.dataset.zborder;m.border=v!=='none';m.dashed=v==='dashed';changed({insp:true})}return}
  const zbc=e.target.closest('[data-zbcolor]');if(zbc){const m=findMark(state.sel);if(m){commit();m.bcolor=zbc.dataset.zbcolor;changed({insp:true})}return}
  const zs=e.target.closest('[data-zshape]');if(zs){const m=findMark(state.sel);if(m){commit();m.rx=+zs.dataset.zshape;changed({insp:true})}return}
  const msw=e.target.closest('[data-mcolor]');
  if(msw){const m=findMark(state.sel);if(m){commit();m.color=msw.dataset.mcolor;changed({insp:true})}return}
  const tp=e.target.closest('[data-tpl]');if(tp){applyTemplate(+tp.dataset.tpl);return}
  const otd=e.target.closest('[data-otpldel]');if(otd){delOwnTpl(otd.dataset.otpldel);return}
  const ot=e.target.closest('[data-otpl]');if(ot){applyOwnTpl(ot.dataset.otpl);return}
  const tg=e.target.closest('[data-tag]');if(tg){toggleTag(tg.dataset.tag);return}
  const kd=e.target.closest('[data-kind]');if(kd){state.kindF=kd.dataset.kind;return renderSide()}
  const gp=e.target.closest('[data-grp]');if(gp){const k=gp.dataset.grp;state.collapsed[k]=!state.collapsed[k];try{localStorage.setItem('pbb-fold',JSON.stringify(state.collapsed))}catch(err){}return renderSide()}
  const a=e.target.closest('[data-a]');if(!a)return;
  const act=a.dataset.a;const p=selPlayer();
  if(isRO(curPb())&&RO_BLOCK.has(act))return toast('👁 Nur Lesezugriff – dieses Playbook wurde mit dir geteilt.');
  switch(act){
    case 'newPb':return newPbDialog();
    case 'newForm':return touchAsk('Neue Formation anlegen?').then(ok=>ok&&addForm());
    case 'playFromForm':return playFromForm();
    case 'toForm':return setKind(true);
    case 'toPlay':return setKind(false);
    case 'lockAll':case 'unlockAll':return lockAll(act==='lockAll');
    case 'suggestTasks':return suggestDialog();
    case 'tasksCheck':return tasksDialog();
    case 'progress':return progressDialog(curPb());
    case 'help':return helpDialog();
    case 'trash':return trashDialog();
    case 'teamPlays':return teamPlaysDialog();
    case 'snaps':return snapDialog(curPb());
    case 'playToTeam':return playToTeam();
    case 'pbToTeam':{const pb=curPb(),t=Team.auto();if(!pb||!t)return;if(pb.cloud&&pb.cloud.role&&pb.cloud.role!=='own')return toast('Teilen kann nur, wem das Playbook gehört.');document.querySelectorAll('.mback').forEach(x=>x.remove());Sync.touch(pb);Team.apply(pb,t);Sync.touch(pb);await Sync.push(pb.id);renderSide();
      if(Sync.state==='ok')refreshAccess(pb).catch(e=>console.warn('access refresh',e));return toast(Sync.state==='ok'?`„${pb.name}“ ist jetzt mit dem Team „${t.name}“ geteilt`:'Gespeichert – wird übertragen, sobald du online bist')}
    case 'account':return accountDialog();
    case 'openQs':return openQsDialog();
    case 'togSide':return toggleMin('side');
    case 'togInsp':return toggleMin('insp');
    case 'present':return setPresent(true);
    case 'learn':return startLearn();
    case 'home':state.home=true;return renderHome();
    case 'homePb':case 'homeLearn':{const id=a.dataset.pb;if(id&&id!==state.pbId){state.pbId=id;const pb=curPb();state.playId=pb&&pb.plays[0]?pb.plays[0].id:null;state.sel=null;state.undo=[];state.redo=[];saveUI()}
      if(act==='homeLearn')return startLearn();state.home=false;return renderAll()}
    case 'presExit':return setPresent(false);
    case 'presPrev':return presStep(-1);
    case 'presNext':return presStep(1);
    case 'presNotes':state.presNotes=!state.presNotes;return renderPresentBar();
    case 'drawDone':return finishDrawing();
    case 'drawCancel':{const p=curPlay()&&state.drawing&&findP(state.drawing.pid);state.drawing=null;state.cursor=null;undo();state.mode='select';return renderCenter()}
    case 'laser':return Laser.toggle();
    case 'feedback':return feedbackDialog();
    case 'backupAll':return backupAll();
    case 'backupLater':try{localStorage.setItem('pbb-backupSnooze',String(Date.now()+3*864e5))}catch(e){}return showBanner();
    case 'history':return historyDialog();
    case 'folderOn':return Folder.connect();
    case 'folderClaim':return Folder.decide(true).then(()=>renderAll());
    case 'folderReconnect':return Folder.reconnect();
    case 'folderOff':return Folder.disconnect();
    case 'pbMenu':return pbMenu();
    case 'newPlay':return touchAsk('Neues Play anlegen?').then(ok=>ok&&addPlay());
    case 'up':return movePlay(a.dataset.id,-1);
    case 'down':return movePlay(a.dataset.id,1);
    case 'sheet':return sheetDialog();
    case 'exportPb':return exportPb();
    case 'import':return importDialog();
    case 'undo':return undo();
    case 'redo':return redo();
    case 'anim':return state.anim?stopAnim():startAnim();
    case 'snap':state.snap=!state.snap;saveUI();return renderCenter();
    case 'oppRoutes':{const pb=curPb();if(pb&&pb.gw)state.gwOppR=!oppROn();else state.oppRoutes=!state.oppRoutes}saveUI();if(state.anim)stopAnim(true);return renderCenter();
    case 'pickStart':state.pick=new Set();return renderSide();
    case 'pickEnd':state.pick=null;return renderSide();
    case 'pickAll':{const pb=curPb();const q=state.q.trim();state.pick=new Set(sortKinds(pb.plays).filter(pl=>playMatches(pl,q)).map(pl=>pl.id));return renderSide()}
    case 'pickNone':state.pick=new Set();return renderSide();
    case 'pickGW':return gwAddDialog();
    case 'gwInfo':return gwInfoDialog();
    case 'gwArchive':return gwArchive(true);
    case 'gwPush':return gwPush();
    case 'gwUnarchive':return gwArchive(false);
    case 'gwRematch':return gwRematch();
    case 'gwRefresh':return gwRefresh();
    case 'gwDel':return gwDelete(curPb());
    case 'gwImport':return gwImportDialog();
    case 'gwScout':state.gwScoutOpen=!state.gwScoutOpen;return renderSide();
    case 'night':state.night=!state.night;document.documentElement.classList.toggle('night',state.night);
      if(state.night&&state.style==='light')state.style='dark';else if(!state.night&&state.style==='dark')state.style='light';   // field follows once – can be changed any time
      saveUI();nightBtn();return renderAll();
    case 'style':state.style={light:'grass',grass:'dark',dark:'light'}[state.style]||'light';saveUI();renderPresentBar();return renderCenter();
    case 'lock':{const pb=curPb(),pl=curPlay();if(!pl)return;if(isRO(pb))return toast('👁 Nur Lesezugriff – dieses Playbook wurde mit dir geteilt.');
      if(pl.locked){if(!await confirmBox('Play entsperren?',`„${esc(pl.name)}“ kann danach wieder verändert werden.`,'Entsperren'))return;pl.locked=false;toast('🔓 Entsperrt')}
      else{if(state.drawing)finishDrawing(true);pl.locked=true;state.sel=null;state.mode='select';toast('🔒 Play gesperrt')}
      Store.savePlay(pb,pl);renderAll();return}
    case 'dupPlay':return dupPlay();
    case 'saveTpl':return saveOwnTpl();
    case 'setLayout':{const pb=curPb(),pl=curPlay();pb.layoutPlayId=pl.id;Store.savePb(pb);renderInsp();renderSide();
      if(pb.plays.length>1&&await confirmBox('Layout auf alle Plays anwenden?',`Farben und Formen von „${esc(pl.name)}“ werden auf alle ${pb.plays.length-1} anderen Plays übertragen (Spieler werden über ihre Bezeichnung zugeordnet, z. B. CB → CB). Neue Plays bekommen das Layout automatisch.`,'Anwenden'))applyLayoutAll();
      else toast('Layout-Vorlage festgelegt – neue Plays übernehmen sie automatisch.');return}
    case 'applyLayout':{if(await confirmBox('Layout auf alle Plays anwenden?','Farben und Formen dieses Plays werden auf alle anderen Plays übertragen.','Anwenden'))applyLayoutAll();return}
    case 'unsetLayout':{const pb=curPb();delete pb.layoutPlayId;Store.savePb(pb);renderInsp();renderSide();return toast('Vorlage aufgehoben')}
    case 'applyLayoutHere':{const pb=curPb(),t=layoutTpl(pb);if(!t)return;commit();applyLayout(t,curPlay());changed({insp:true});return toast('Layout übernommen')}
    case 'mirror':return mirror();
    case 'flipV':{const pl=curPlay();commit();pl.flipV=!pl.flipV;changed({center:true});return toast(pl.flipV?'Vertikal gespiegelt':'Vertikale Spiegelung aufgehoben')}
    case 'delPlay':return delPlay();
    case 'sharePlay':return sharePlay();
    case 'png':{const pb=curPb(),pl=curPlay();try{await saveFile(fname(pl.name)+'.png',await toPNG(singleSVG(pb,pl),2))}catch(err){toast(err.message)}return}
    case 'svg':{const pb=curPb(),pl=curPlay();return saveFile(fname(pl.name)+'.svg',singleSVG(pb,pl))}
    case 'toggleOpp':{const pl=curPlay();commit();pl.showOpp=a.checked;return changed({})}
    case 'desel':state.sel=null;state.selRoute=null;state.drawing=null;renderField();return renderInsp();
    case 'drawRoute':state.mode='route';startDrawing('route',p.id);return renderCenter();
    case 'drawMotion':state.mode='motion';startDrawing('motion',p.id);return renderCenter();
    case 'delRoute':commit();p.route=null;return changed({insp:true});
    case 'delMotion':commit();p.motion=null;return changed({insp:true});
    case 'popPoint':{const key=curRouteKey(p);const r=getRoute(p,key);if(!r)return;commit();r.pts.pop();if(!r.pts.length){if(key.k==='alt')p.alts.splice(key.j,1);else p[key.k]=null;state.selRoute=null}return changed({insp:true})}
    case 'delSelRoute':{const key=curRouteKey(p);if(!key)return;commit();if(key.k==='alt')p.alts.splice(key.j,1);else p[key.k]=null;
      if(key.k==='route'&&p.alts&&p.alts.length){const a=p.alts.shift();if(a.style==='dotted')a.style='solid';p.route=a;state.selRoute={k:'route',j:0};toast('Hauptroute gelöscht – die Alternative ist jetzt die Hauptroute');return changed({insp:true})}
      state.selRoute=null;return changed({insp:true})}
    case 'delPlayer':{const pl=curPlay(),id=state.sel,what=pl&&((pl.marks||[]).some(m=>m.id===id)?'Markierung':'Spieler');
      return confirmBox(`${what} löschen?`,`${what==='Spieler'?'Den Spieler mit seinen Routen':'Die Markierung'} löschen? (↶ holt sie zurück)`,'Löschen').then(ok=>{if(ok){state.sel=id;deletePlayer()}})}
    case 'multiMode':state.multiMode=!state.multiMode;if(state.multiMode){state.mode='select';toast('Spieler nacheinander antippen – dann gemeinsam ziehen oder rechts ausrichten')}return renderCenter();
    case 'multiClear':state.multi=[];state.sel=null;renderField();return renderInsp();
    case 'alignY':case 'alignX':case 'distX':case 'multiDel':return multiAct(act);
    case 'copyRoute':return copyRoute();
    case 'altToMain':{const key=curRouteKey(p);if(!key||key.k!=='alt')return;const a=(p.alts||[])[key.j];if(!a)return;commit();
      const old=p.route&&hasLine(p.route)?p.route:null;if(a.style==='dotted')a.style='solid';p.route=a;p.alts.splice(key.j,1);
      if(old){old.style='dotted';p.alts.splice(key.j,0,old)}state.selRoute={k:'route',j:0};toast(old?'Getauscht: Alternative ist jetzt die Hauptroute':'Ist jetzt die Hauptroute');return changed({insp:true})}
    case 'contRoute':return continueDrawing();
    case 'pickCancel':state.pickMan=null;renderField();renderCenter();return renderInsp();
    case 'pasteRoute':return pasteRoute(false);
    case 'pasteRouteM':return pasteRoute(true);
    case 'animPause':return animPause();
    case 'animFwd':return animStepBy(0.2);
    case 'animBack':return animStepBy(-0.2);
    case 'video':return exportAnim('video');
    case 'gif':return exportAnim('gif');
    case 'quiz':if(state.anim)stopAnim();state.quiz=!state.quiz;state.quizDone=new Set();state.quizWrong=new Set();state.quizOnly=null;
      if(state.quiz){const pb=curPb(),pool=sortKinds(pb.plays).filter(x=>isF(curPlay())?isF(x)&&(x.name||'').trim():!isF(x)&&quizInfo(pb,x).asked.length);if(pool.length){selectPlay(pool[Math.floor(Math.random()*pool.length)].id);state.quiz=true}}state.quizShown=false;state.qa=null;renderField();return renderPresentBar();
    case 'quizShow':if(state.quizShown&&state.anim)stopAnim();if(!state.quizShown){const pl=curPlay(),qa=qaState();const open=pl&&pl.players.find(p=>manOpen(pl,qa,p.id));
      if(open){qa.pick=open.id;qa.manPick=open.id;renderField();quizPanel();return toast(`${open.label} spielt Man – erst den Gegenspieler antippen.`)}}
    if(state.quizShown)state.qa=null;else{(state.quizDone=state.quizDone||new Set()).add(state.playId);const R=quizResult(curPb(),curPlay());quizMark(curPlay(),R.ok===R.n);state.quizCounted=Prog.result(curPb(),curPlay(),R.ok,R.n)}state.quizShown=!state.quizShown;renderField();return renderPresentBar();
    case 'quizNextPlay':return quizNextPlay();
    case 'formShow':{const pb=curPb(),pl=curPlay(),qa=qaState();if(!pl||!isF(pl)||qa.form)return;qa.form='\u0000';   // revealed without an answer
      (state.quizDone=state.quizDone||new Set()).add(pl.id);quizMark(pl,false);state.quizCounted=Prog.result(pb,pl,0,1);return renderPresentBar()}
    case 'quizKind':{const pb=curPb(),want=a.dataset.k==='forms';if(isF(curPlay())===want)return;
      let pool=sortKinds(pb.plays).filter(x=>want?isF(x)&&(x.name||'').trim():!isF(x)&&quizInfo(pb,x).asked.length);
      if(!pool.length&&!want){pool=sortKinds(pb.plays).filter(x=>!isF(x));if(pool.length)toast('In den Plays sind noch keine Aufgaben eingetragen – Coaches können sie über ⋯ → „🎓 Aufgaben vorschlagen“ ergänzen.')}
      if(!pool.length)return toast(want?'Keine Formations mit Namen.':'Keine Plays vorhanden.');
      state.quizDone=new Set();state.quizWrong=new Set();state.quizOnly=null;selectPlay(pool[Math.floor(Math.random()*pool.length)].id);return}
    case 'install':return installApp();
    case 'drawAlt':state.mode='route';startDrawing('alt',p.id);return renderCenter();
    case 'tplAlt':state.tplAlt=true;return renderInsp();
    case 'tplReplace':state.tplAlt=false;return renderInsp();
    case 'drawBlitz':state.mode='route';state.pendingEnd='bolt';startDrawing('route',p.id);return renderCenter();
    case 'blitzMode':state.mode='route';state.pendingEnd='bolt';state.sel=null;renderCenter();renderInsp();return toast('Tippe den Spieler an, der blitzt, dann den Weg.');
    case 'delAlts':commit();p.alts=[];return changed({insp:true});
    case 'addZone':case 'addText':case 'addBolt':{
      const pl=curPlay(),pb=curPb();const v=VP(pb,pl);commit();pl.marks=pl.marks||[];
      const own=pb.type==='defense'?-1:1;
      const m=act==='addZone'?{type:'zone',x:-v.W/6,y:own<0?-12:-14,w:v.W/3,h:5,rx:99,color:'#ef4444',opacity:0.22,dashed:false,border:true}
        :act==='addText'?{type:'text',x:v.W/2-6,y:-v.up+2,text:'Text',size:2,color:INK}
        :{type:'bolt',x:0,y:-4,size:1.6,rot:0,color:'#f97316'};
      m.id=uid('m');pl.marks.push(m);state.sel=m.id;state.mode='select';changed({center:true,insp:true});
      if(m.type==='text')setTimeout(()=>{const i=$('[data-mf=text]');if(i){i.focus({preventScroll:true});i.select()}},30);return}
    case 'delMark':{const pl=curPlay();commit();pl.marks=(pl.marks||[]).filter(m=>m.id!==state.sel);state.sel=null;return changed({insp:true})}
  }
});
function copyRoute(){const p=selPlayer();const key=p&&!isOpp(p.id)&&curRouteKey(p);const r=key&&getRoute(p,key);if(!r||!r.pts.length)return false;
  state.clip={k:key.k==='motion'?'motion':'route',r:clone(r)};toast('Linie kopiert – anderen Spieler wählen und einfügen');renderInsp();return true}
function pasteRoute(mirror){
  if(!state.clip)return;const ids=(state.multi.length>1?state.multi:[state.sel]).filter(id=>id&&findP(id)&&!isOpp(id));if(!ids.length)return toast('Wähle zuerst einen eigenen Spieler.');
  commit();ids.forEach(id=>{const p=findP(id);const r=clone(state.clip.r);if(mirror)r.pts.forEach(q=>{q.x=-q.x});
    if(state.clip.k==='motion')p.motion=r;else if(state.tplAlt&&hasLine(p.route)&&ids.length===1){r.style='dotted';(p.alts=p.alts||[]).push(r);state.selRoute={k:'alt',j:p.alts.length-1}}else p.route=r});
  changed({insp:true});toast(ids.length>1?`Bei ${ids.length} Spielern eingefügt`:'Eingefügt');
}
function multiAct(act){
  const ps=state.multi.map(findP).filter(Boolean);if(ps.length<2)return;const ref=ps[ps.length-1];commit();
  if(act==='alignY')ps.forEach(p=>{p.y=ref.y});
  if(act==='alignX')ps.forEach(p=>{p.x=ref.x});
  if(act==='distX'){const a=ps.slice().sort((x,y)=>x.x-y.x);const l=a[0].x,r=a[a.length-1].x;a.forEach((p,i)=>{p.x=r1(l+(r-l)*i/(a.length-1))})}
  if(act==='multiDel'){const pl=curPlay(),ids=state.multi;pl.players=pl.players.filter(p=>!ids.includes(p.id));pl.opp=pl.opp.filter(p=>!ids.includes(p.id));state.multi=[];state.sel=null}
  changed({insp:true});
}
function deletePlayer(){
  const pl=curPlay();if(!state.sel)return;commit();
  pl.players=pl.players.filter(p=>p.id!==state.sel);pl.opp=pl.opp.filter(p=>p.id!==state.sel);pl.marks=(pl.marks||[]).filter(m=>m.id!==state.sel);state.sel=null;state.drawing=null;changed({insp:true});
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pbSel')return selectPb(t.value);
  if(t.id==='tagFilter'){state.tagF=t.value;return renderSide()}
  if(t.id==='animRate'){state.animRate=+t.value||1;if(state.anim)state.anim.rate=state.animRate;return}
  if(t.id==='formSel'&&t.value)return loadFormation(t.value);
  if(t.id==='oppSel')return loadOpp(t.value);
  if(t.dataset.pf==='shape'||t.dataset.pf==='read'){const p=selPlayer();commit();p[t.dataset.pf]=t.dataset.pf==='read'?+t.value:t.value;return changed({})}
  if(t.id==='animOpt'){state.animOpt=+t.value;return}
  if(t.dataset.rf){const p=selPlayer();const r=p&&getRoute(p,curRouteKey(p));if(!r)return;commit();const f=t.dataset.rf;if(f==='condrb'){if(t.checked)r.cond='rb';else delete r.cond;return changed({})}r[f]=t.type==='checkbox'?t.checked:(f==='speed'||f==='delay')?+t.value:f==='task'?t.value.trim().slice(0,30):t.value;if(f==='task'&&!r.task)delete r.task;return changed({})}
});
document.addEventListener('focusin',e=>{if(e.target.dataset&&(e.target.dataset.f||e.target.dataset.mf||e.target.dataset.pf==='label'||e.target.dataset.pf==='det'))state.editSnap=curPlay()?JSON.stringify(curPlay()):null});
document.addEventListener('pointerdown',e=>{if(e.target.dataset&&(e.target.dataset.mf||e.target.dataset.rw))state.editSnap=curPlay()?JSON.stringify(curPlay()):null},true);
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='playSearch'){state.q=t.value;const pb=curPb(),nl=$('.plays');if(pb&&nl){nl.innerHTML=playListHTML(pb);markCurPlay();$('#side')._h=null}return}
  if(t.id==='zoom'){state.zoom=+t.value;const f=$('#field');if(f)f.style.width=state.zoom+'%';clearTimeout(state.zt);state.zt=setTimeout(saveUI,300);return}
  const pl=curPlay();if(!pl)return;
  if(t.dataset.rw){const p=selPlayer();const r=p&&getRoute(p,curRouteKey(p));if(!r)return;
    if(state.editSnap){state.undo.push(state.editSnap);state.redo=[];state.editSnap=null;}
    r.w=+t.value;showRangeVal(t);return changed({});}
  if(t.dataset.mf){const m=findMark(state.sel);if(!m)return;showRangeVal(t);
    if(state.editSnap){state.undo.push(state.editSnap);state.redo=[];state.editSnap=null;}
    const f=t.dataset.mf;if(f==='text')m.text=t.value;else{const n=parseFloat(String(t.value).replace(',','.'));if(isNaN(n))return;m[f]=f==='w'||f==='h'?Math.max(0.5,n):n}
    return changed({});}
  if(t.dataset.pf==='det'){const p=selPlayer();if(!p)return;if(state.editSnap){state.undo.push(state.editSnap);state.redo=[];state.editSnap=null;}
    const v=t.value.slice(0,120);if(v.trim())p.det=v;else delete p.det;return changed({field:false});}
  if(t.dataset.f||t.dataset.pf==='label'){
    if(state.editSnap){state.undo.push(state.editSnap);state.redo=[];state.editSnap=null;}
    if(t.dataset.f){const old=pl.name;if((t.dataset.f==='ball'||t.dataset.f==='fake'||t.dataset.f==='fake2')&&(pl.ball==='fakePass'||pl.ball==='fakeKeep')){pl.fake=pl.fake||'RB';pl.ball=pl.ball==='fakePass'?'read1':'keep'}pl[t.dataset.f]=t.value;if(isF(pl)&&t.dataset.f==='name'){pl.formation=t.value;const pb=curPb();pb.plays.forEach(x=>{if(!isF(x)&&x.formation&&x.formation.trim()===old.trim()){x.formation=t.value;Store.savePlay(pb,x)}})}}else{const p=selPlayer();if(p)p.label=t.value.toUpperCase().slice(0,3)}
    changed({field:!!t.dataset.pf});if(t.dataset.f==='fake')renderInsp();
  }
});
document.addEventListener('pointerdown',e=>{if(e.target.closest('#field'))onDown(e)});
document.addEventListener('pointermove',e=>{if(state.drag||state.drawing){if(e.target.closest&&e.target.closest('#field')||state.drag)onMove(e)}});
document.addEventListener('pointerup',onUp);
document.addEventListener('pointercancel',onUp);
document.addEventListener('dblclick',e=>{if(e.target.closest('#field')&&state.drawing)finishDrawing()});
document.addEventListener('keydown',e=>{
  if(needLogin())return;
  if(e.target.id==='tagNew'&&e.key==='Enter'){e.preventDefault();const v=e.target.value;e.target.value='';toggleTag(v);const n=$('#tagNew');if(n)n.focus({preventScroll:true});return}
  if($('.mback'))return;
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(e.key==='Escape'&&Laser.on){Laser.toggle(false);return}
  if(state.present){const k=e.key;
    if((k==='ArrowRight'||k==='PageDown'||k==='ArrowLeft'||k==='PageUp')&&state.quiz&&isPlayer(curPb()))return;
    if(k==='ArrowRight'||k==='PageDown'){e.preventDefault();return presStep(1)}
    if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();return presStep(-1)}
    if(k===' '){e.preventDefault();return !state.anim?startAnim():state.anim.done?stopAnim():animPause()}
    if(k.toLowerCase()==='n'){state.presNotes=!state.presNotes;return renderPresentBar()}
    if(state.quiz&&(k.toLowerCase()==='a'||k==='Enter')){state.quizShown=!state.quizShown;renderField();return renderPresentBar()}
    if(k==='Escape'){return setPresent(false)}}
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.key.toLowerCase()==='l'){Laser.toggle();return}
  if(!curPlay())return;
  if(isLk(curPlay()))return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();return e.shiftKey?redo():undo()}
  if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();return redo()}
  if((e.ctrlKey||e.metaKey)&&k==='c'&&!String(getSelection()||'')){if(copyRoute())e.preventDefault();return}
  if((e.ctrlKey||e.metaKey)&&k==='v'&&state.clip&&(state.sel||state.multi.length)){e.preventDefault();return pasteRoute(e.shiftKey)}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(k==='enter'&&state.drawing){e.preventDefault();return finishDrawing()}
  if(k==='escape'&&state.pickMan){state.pickMan=null;renderField();renderInsp();return}
  if(k==='escape'){if(state.drawing){const p=findP(state.drawing.pid);if(p&&drawArr(p).length)return finishDrawing();state.drawing=null;state.cursor=null;undo();return}
    state.sel=null;state.mode='select';renderCenter();return renderInsp()}
  if((k==='delete'||k==='backspace')&&state.multi.length>1){e.preventDefault();return multiAct('multiDel')}
  if((k==='delete'||k==='backspace')&&state.sel){e.preventDefault();return deletePlayer()}
  const map={v:'select',r:'route',m:'motion',p:'add'};
  if(map[k]){const b=document.querySelector(`[data-mode="${map[k]}"]`);if(b)b.click()}
});

/* ---------- init ---------- */
(async function init(){
  renderAll();
  Trash.load();
  const data=await Store.init();
  state.pbs=Array.isArray(data)?data:[];
  state.pbs.forEach(pb=>{if(migrateFlag(pb)){Store.savePb(pb);pb.plays.forEach(pl=>Store.savePlay(pb,pl))}});
  Sync.start();
  let last=null;try{last=JSON.parse(localStorage.getItem('pbb-ui')||'{}').pb}catch(e){}
  const pb=state.pbs.find(p=>p.id===last)||state.pbs[0];
  state.pbId=pb?pb.id:null;state.playId=pb&&pb.plays[0]?pb.plays[0].id:null;
  try{await Folder.init()}catch(e){console.warn(e)}
  showBanner();renderAll();setTimeout(maybeLearn,400);
})();
</script>
