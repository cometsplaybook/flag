<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Playbook Builder</title>
<meta name="theme-color" content="#4169e1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Playbook">
<style>
:root{
  --cond:'Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif;
  --bg:#efece4; --panel:#fffdf8; --ink:#1b1f1d; --muted:#6b6f68; --line:#ddd8cc;
  --turf:#1f6b3f; --turf2:#17552f; --navy:#4169e1; --accent:#e8590c; --accent2:#fff1e6; --sel:#f59e0b;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.logo{font-family:var(--cond);font-stretch:condensed;font-weight:800;font-size:24px;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.logo svg{width:28px;height:28px}
.status{margin-left:auto;font-size:13px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:99px;white-space:nowrap}
.status.warn{background:#b45309}
.hbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-weight:600}
.hbtn:hover{background:rgba(255,255,255,.25)}
.app{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:12px;padding:12px;min-height:calc(100vh - 52px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
aside.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.pbhead{display:flex;gap:6px}
.pbhead select{flex:1;min-width:0}
select,input[type=text],textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
textarea{resize:vertical;min-height:90px}
.chip{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:99px;background:var(--accent2);color:var(--accent)}
.chip.def{background:#e7eefc;color:#1d4ed8}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:#bdb6a6;background:#faf8f2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#d24f08}
.btn.danger{color:#b91c1c}
.btn.sm{padding:4px 8px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.plays{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:120px;max-height:calc(100vh - 290px)}
.play{display:grid;grid-template-columns:22px 64px 1fr auto;gap:8px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.play:hover{border-color:#bdb6a6}
.play.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent2)}
.play .num{font-family:var(--cond);font-stretch:condensed;font-weight:800;font-size:18px;text-align:center}
.play svg{width:64px;height:auto;border-radius:4px;display:block;border:1px solid var(--line)}
.play .nm{font-weight:600;line-height:1.15;overflow:hidden;text-overflow:ellipsis}
.play .ct{font-size:12px;color:var(--muted)}
.play .mv{display:flex;flex-direction:column}
.play .mv button{border:0;background:none;padding:0 4px;color:var(--muted);font-size:12px;line-height:1.3}
.play .mv button:hover{color:var(--ink)}
.sidefoot{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.center{display:flex;flex-direction:column;gap:10px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toolbar .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.toolbar select{width:auto}
.fieldwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;justify-content:center;align-items:flex-start;flex:1}
#field{width:100%;touch-action:pinch-zoom;user-select:none;-webkit-user-select:none;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#field.m-route,#field.m-motion,#field.m-add{cursor:crosshair}
#field .pl{cursor:grab}
#field [data-h]{cursor:move}
.zoom{display:inline-flex;align-items:center;gap:6px;font-size:14px;margin-left:auto}
.zoom input{width:120px;accent-color:var(--accent);border:0;padding:0;background:none}
.rv{display:inline-block;min-width:30px;margin-left:4px;padding:0 6px;border-radius:6px;background:var(--accent2);color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.lockfs{border:0;padding:0;margin:0;min-width:0}
.lockfs[disabled]{opacity:.6}
.lockbtn.locked{background:#fef3c7;border-color:#f59e0b}
.picklist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff}
.picklist label{display:flex!important;gap:6px;align-items:center;font-weight:400!important;margin:0!important;padding:4px 0;border-bottom:1px solid #f1eee6;cursor:pointer}
.picklist label:last-child{border-bottom:0}
.picklist small{color:var(--muted)}
.picklist small.tagnew{color:#15803d;font-weight:700}.picklist small.tagupd{color:#c2410c;font-weight:700}
.folderbox{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:6px 8px;font-size:13px}
.folderbox .hint{flex-basis:100%;font-size:12px}
.folderbox button{margin-left:auto}
.fbshot{border:1px dashed var(--line);border-radius:8px;padding:6px;background:#fff;max-height:220px;overflow:auto;text-align:center}
.fbshot img{max-width:100%;display:block;margin:auto}
#laser{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:70;display:none}
body.lasering,body.lasering *{cursor:none!important}
.laserbtn.on{background:#dc2626;border-color:#dc2626;color:#fff}
#printRoot{display:none}
@media print{
  @page{size:A4;margin:0}
  body.printing>*:not(#printRoot){display:none!important}
  body.printing{background:#fff}
  body.printing #printRoot{display:block}
  .ppage{width:210mm;height:296mm;page-break-after:always;break-after:page;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;padding:10mm;box-sizing:border-box}
  .ppage:last-child{page-break-after:auto;break-after:auto}
  .ppage svg{width:190mm;height:auto;max-height:276mm}
  .ppage.real{padding:0}.ppage.real svg{width:210mm;height:297mm;max-height:none}
  .ppage.land{width:297mm;height:209mm}.ppage.land svg{width:277mm;max-height:189mm}
}
.mback.busy{z-index:200}
.acct-tabs{display:flex;gap:6px;margin-bottom:10px}
.share-row{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.share-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.shared{background:#e0e7ff;color:#3730a3}
#acctBtn.on{background:rgba(255,255,255,.28)}
.kindtabs{display:flex;gap:4px;margin:6px 0 2px}.kindtabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 2px;font-size:12px;cursor:pointer}
.kindtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.plgroup{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;background:#f1efe9;border-radius:7px;cursor:pointer;font:inherit;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;grid-column:1/-1;margin:2px 0}
.plgroup:hover{color:var(--ink)}.plgroup span{font-size:12px;width:10px}
.play.isform .num{background:#e0e7ff;color:#3730a3;font-size:12px}
.newrow{display:grid;grid-template-columns:1fr auto;gap:6px}.newrow .btn{white-space:nowrap;padding-left:8px;padding-right:8px}
.cpick{display:inline-block;width:26px;height:26px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;cursor:pointer;vertical-align:middle;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.cpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.chk{display:flex;gap:6px;align-items:center;color:var(--ink);font-weight:400;margin-top:6px}
.hrow{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hrow svg{width:110px;border:1px solid var(--line);border-radius:4px}.hrow .hint{display:block;font-size:12px}
.trow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.trow .hint{display:block;font-size:12px}
#tagFilter{width:100%;padding:5px 8px;font-size:13px}
#playSearch{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px}
body.presenting header,body.presenting #side,body.presenting #insp,body.presenting .toolbar,body.presenting .hintbar,body.presenting #bannerWrap{display:none!important}
body.presenting .app{display:block;padding:64px 8px 8px;min-height:100vh}
body.presenting .fieldwrap{border:0;background:transparent;padding:0}
body.presenting #field{width:100%!important;height:calc(100vh - 80px);box-shadow:none}
#presentBar .btn{color:var(--ink)}#presentBar .btn.on,#presentBar .btn.primary{color:#fff}#presentBar select{width:auto;color:var(--ink);padding:4px 8px}
#presentBar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--navy);color:#fff}
#presentBar .ptitle{flex:1;display:flex;gap:10px;align-items:baseline;min-width:0;overflow:hidden;white-space:nowrap}
#presentBar .ptitle b{font-family:var(--cond);font-stretch:condensed;font-size:22px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
#presentBar .ptitle span{opacity:.8;font-size:14px}
#presentBar .sep{width:1px;height:24px;background:rgba(255,255,255,.3)}
#presNotesBox{position:fixed;left:16px;bottom:16px;max-width:min(560px,90vw);z-index:41;background:rgba(255,253,248,.96);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:16px;line-height:1.4;white-space:pre-wrap;box-shadow:0 6px 20px rgba(0,0,0,.15)}
@media (pointer:coarse){
  .btn{min-height:38px}.btn.sm{min-height:34px}
  .tpl button{padding:10px 2px}
  .sw button{width:34px;height:34px}
  .play .mv button{font-size:16px;padding:4px 8px}
}
.hintbar{font-size:13px;color:var(--muted);min-height:18px}
.hintbar b{color:var(--ink)}
aside.insp h3{font-family:var(--cond);font-stretch:condensed;font-size:20px;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
aside.insp h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
aside.insp label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:8px 0 3px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row>*{flex:1}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.shapes{display:flex;gap:6px}
.shapes button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px;line-height:0}
.shapes button.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);background:var(--accent2)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tpl button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 2px;font-size:13px;font-weight:600}
.tpl button:hover{border-color:var(--accent);color:var(--accent)}
.hint{font-size:13px;color:var(--muted);line-height:1.4}
.welcome{max-width:520px;margin:40px auto;text-align:center}
.welcome h2{font-family:var(--cond);font-stretch:condensed;font-size:34px;text-transform:uppercase;margin:0 0 8px}
.welcome p{color:var(--muted);line-height:1.5}
/* modal */
.mback{position:fixed;inset:0;background:rgba(20,24,22,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin:0 0 12px;font-family:var(--cond);font-stretch:condensed;font-size:24px;text-transform:uppercase}
.modal .mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice label{margin:0;border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.choice label small{display:block;font-weight:400;color:var(--muted)}
.choice input{margin-top:4px}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent2)}
.modal ul{padding-left:18px;line-height:1.55}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.banner{background:#fff7ed;border:1px solid #fdba74;color:#7c2d12;border-radius:8px;padding:8px 12px;font-size:13px}
.app{position:relative}
.ptog{position:absolute;top:22px;z-index:5;width:22px;height:46px;padding:0;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;font-size:11px;color:var(--muted);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.ptog:hover{color:var(--ink);border-color:var(--ink)}
#togSide{left:277px}#togInsp{right:307px}
body.presenting .ptog{display:none}
@media (min-width:1101px){
  body.side-min .app{grid-template-columns:minmax(0,1fr) 300px}
  body.insp-min .app{grid-template-columns:270px minmax(0,1fr)}
  body.side-min.insp-min .app{grid-template-columns:minmax(0,1fr)}
  body.side-min aside.side{display:none}
  body.side-min #togSide{left:3px}
  body.side-min .app{padding-left:30px}
}
@media (min-width:761px){
  body.insp-min aside.insp{display:none}
  body.insp-min #togInsp{right:3px}
  body.insp-min .app{padding-right:30px}
}
/* tablet: options stay on the right, the play list moves below the field */
@media (min-width:761px) and (max-width:1100px){
  .app{grid-template-columns:minmax(0,1fr) 280px;min-height:0;align-items:start}
  body.insp-min .app{grid-template-columns:minmax(0,1fr)}
  section.center{grid-column:1;grid-row:1}
  aside.side{grid-column:1;grid-row:2}
  aside.insp{grid-column:2;grid-row:1 / span 2;align-self:start;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
  .plays{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));max-height:300px;min-height:0;align-content:start}
  #togSide{display:none}
  #togInsp{right:287px}
}
@media (max-width:760px){
  .ptog{display:none}
  #field{width:100%!important}
  .zoom{display:none}
  .app{grid-template-columns:1fr;padding:8px}
  .plays{max-height:240px}
  #field{max-height:none}
  .logo span{display:none}
}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 32 32"><ellipse cx="16" cy="16" rx="14" ry="9" transform="rotate(-35 16 16)" fill="#8b5a2b" stroke="#fff" stroke-width="1.5"/><path d="M11 21 21 11M13 15l4 4M15 13l4 4M11 17l4 4" stroke="#fff" stroke-width="1.6"/></svg><span>Playbook Builder</span></div>
  <div class="status" id="status">Lädt…</div>
  <button class="hbtn" id="acctBtn" data-a="account" title="Konto & Synchronisierung" hidden>👤 Anmelden</button>
  <button class="hbtn" data-a="feedback" title="Fehler melden, Verbesserungen und Wünsche schicken">✉ Feedback</button>
  <button class="hbtn" data-a="help" title="Hilfe">?</button>
</header>
<div id="bannerWrap"></div>
<div class="app" id="app">
  <aside class="side panel" id="side"></aside>
  <section class="center" id="center"></section>
  <aside class="insp panel" id="insp"></aside>
  <button class="ptog" id="togSide" data-a="togSide" title="Play-Liste ein-/ausblenden">◀</button>
  <button class="ptog" id="togInsp" data-a="togInsp" title="Optionen ein-/ausblenden">▶</button>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=(p='')=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const r1=n=>Math.round(n*10)/10;
const FONT='Arial, Helvetica, sans-serif';
const INK='#1b1f1d';
const PAL=['#dc2626','#2563eb','#d97706','#7c3aed','#0d9488','#db2777','#65a30d','#0891b2'];
const HOSTED=!/claude|anthropic/i.test(location.hostname)&&!window.claude;   // running on its own (GitHub Pages / file), not inside Claude
if(HOSTED){const m=document.createElement('meta');m.httpEquiv='Content-Security-Policy';
  m.content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'";
  document.head.appendChild(m)}
const S=10; // svg units per yard
const COARSE=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);   // finger instead of mouse: bigger grab areas

/* ---------- configuration ---------- */
const VAR={
  tackle11:{name:'Tackle 11er',W:53.3,up:25,back:13,hash:6.67},
  flag5:{name:'Flag 5er',W:53.3,up:25,back:13,hash:6.67,rush:7}  // same field as the 11er; only the 7-yard rush line is flag-specific
};
const OL=[['C',0,1,'square'],['G',-2.2,1],['G',2.2,1],['T',-4.4,1],['T',4.4,1]];
const DL4=[['E',-5.5,-1.2],['T',-1.8,-1.2],['T',1.8,-1.2],['E',5.5,-1.2]];
const CBS=[['CB',-20,-7],['CB',20,-7]];
const FC=['C',0,1,'square'];
const FORMS={
  tackle11:{
    off:{
      'I-Form':[...OL,['QB',0,2.2],['FB',0,5],['RB',0,7.5],['Y',6.6,1],['X',-20,1],['Z',16,2]],
      'Shotgun 2x2':[...OL,['QB',0,5],['RB',2.4,5.2],['X',-20,1],['H',-12,2],['Y',12,2],['Z',20,1]],
      'Trips rechts':[...OL,['QB',0,5],['RB',-2.4,5.2],['X',-20,1],['Y',8,2],['H',13,2],['Z',19,1]],
      'Singleback':[...OL,['QB',0,2.2],['RB',0,7],['Y',6.6,1],['X',-20,1],['H',-12,2],['Z',17,2]],
      'Pistol':[...OL,['QB',0,4],['RB',0,7],['Y',6.6,1],['X',-20,1],['H',-12,2],['Z',17,2]],
      'Empty':[...OL,['QB',0,5],['X',-20,1],['H',-13,2],['A',7,2],['Y',13,2],['Z',20,1]],
      'Nur O-Line + QB':[...OL,['QB',0,5]]
    },
    def:{

function applyLayout(tpl,pl){
  const matchList=(src,dst)=>{const seen={};dst.forEach(p=>{const k=(p.label||'').toUpperCase();const n=seen[k]=(seen[k]||0)+1;
      const cand=src.filter(q=>(q.label||'').toUpperCase()===k);const t=cand[Math.min(n,cand.length)-1];if(!t)return;
      p.shape=t.shape;p.color=t.color;if(t.fill)p.fill=t.fill;else delete p.fill;
      const rc=t.route&&t.route.color,mc=t.motion&&t.motion.color;
      if(p.route&&rc)p.route.color=rc;if(p.route&&t.route&&t.route.w)p.route.w=t.route.w;if(p.motion&&(mc||rc))p.motion.color=mc||rc;
      (p.alts||[]).forEach((r,j)=>{const ac=(t.alts&&t.alts[j]&&t.alts[j].color)||(t.alts&&t.alts[0]&&t.alts[0].color)||rc;if(ac)r.color=ac});});};
  matchList(tpl.players,pl.players);matchList(tpl.opp||[],pl.opp||[]);
  ['zone','text','bolt'].forEach(type=>{const t=(tpl.marks||[]).find(m=>m.type===type);if(!t)return;
    (pl.marks||[]).filter(m=>m.type===type).forEach(m=>{m.color=t.color;
      if(type==='zone'){m.opacity=t.opacity;m.border=t.border;m.dashed=t.dashed;if(t.bcolor)m.bcolor=t.bcolor;else delete m.bcolor;if(t.bw)m.bw=t.bw;else delete m.bw}})});

function scalePlayX(pl,k){
  const sr=r=>{if(!r)return;(r.pts||[]).forEach(q=>q.x=r1(q.x*k));if(r.end==='zone')r.zw=r1((r.zw||7.6)*k)};
  [...(pl.players||[]),...(pl.opp||[])].forEach(p=>{p.x=r1(p.x*k);sr(p.route);sr(p.motion);(p.alts||[]).forEach(sr)});
  (pl.marks||[]).forEach(m=>{m.x=r1(m.x*k);if(m.type==='zone')m.w=r1(m.w*k)});
}
// a real line has length; a single dot on the player (from an accidental tap) does not count
function hasLine(r){if(!r||!r.pts||!r.pts.length)return false;let x=0,y=0,l=0;r.pts.forEach(q=>{l+=Math.hypot(q.x-x,q.y-y);x=q.x;y=q.y});return l>=0.6}
// a player who only has alternatives gets the first one as his route (otherwise he stands still when the play runs)
function fixRoutes(pb){let n=0;
  pb.plays.forEach(pl=>[...(pl.players||[]),...(pl.opp||[])].forEach(p=>{
    if(p.route&&!hasLine(p.route)){p.route=null;n++}
    if(p.alts&&p.alts.length){const k=p.alts.length;p.alts=p.alts.filter(hasLine);if(p.alts.length!==k)n++}
    if(!p.route&&p.alts&&p.alts.length){const a=p.alts.shift();if(a.style==='dotted')a.style='solid';p.route=a;n++}}));
  return n>0;
}

const Store={mode:'memory',db:null,uid:null,note:'',
  async init(){

      const order=(m.order||[]).filter(id=>map[id]);Object.keys(map).forEach(id=>{if(!order.includes(id))order.push(id)});
      const pb=clone(m);delete pb.kind;delete pb.order;pb.id=d.id;pb.plays=order.map(id=>map[id]);pbs.push(pb);

function schedule(key,fn,delay=700){
  clearTimeout(W.timers.get(key));W.fns.set(key,fn);

async function run(key){
  const fn=W.fns.get(key);W.timers.delete(key);W.fns.delete(key);if(!fn){updateStatus();return}
  if(W.busy.has(key)){W.again.set(key,fn);return}
  W.busy.add(key);updateStatus();
  try{await fn()}catch(e){
    const c=e&&e.code;console.warn('save error',key,e);
    if(c==='unavailable'){await new Promise(r=>setTimeout(r,1200+Math.random()*800));try{await fn()}catch(e2){toast('Speichern fehlgeschlagen – bitte später erneut ändern.')}}
    else if(c==='invalid_argument'||c==='revoked'||c==='not_granted'){Store.fallback('Du hast für diese Seite keine Schreibrechte im Konto. Deine Playbooks werden stattdessen lokal in diesem Browser gespeichert.')}
    else if(c==='quota_exceeded'){toast('Speicherplatz voll – bitte alte Plays löschen.')}
    else if(key==='local'){toast('Lokaler Speicher voll oder gesperrt.')}
    else toast('Speichern fehlgeschlagen.');
  }
  W.busy.delete(key);
  if(W.again.has(key)){const f=W.again.get(key);W.again.delete(key);W.fns.set(key,f);run(key);}
  updateStatus();
}

/* ---------- folder on the user's computer (File System Access API, Chrome/Edge desktop) ---------- */
const IDB={db:null,
  open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('pbb',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
  async del(k){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
};
const Folder={handle:null,pending:null,files:{},
  supported(){return typeof window.showDirectoryPicker==='function'&&!(window.claude&&window.claude.use)&&window.isSecureContext!==false},
  async init(){
    if(!this.supported())return;
    let h=null;try{h=await IDB.get('folder')}catch(e){}
    if(!h)return;
    try{if((await h.queryPermission({mode:'readwrite'}))==='granted'){this.handle=h;await this.load();return}}catch(e){}
    this.pending=h;   // needs a click to re-grant access
  },
  async connect(){
    let h;try{h=await window.showDirectoryPicker({id:'playbooks',mode:'readwrite'})}catch(e){if(e&&e.name!=='AbortError')toast('Ordner konnte nicht verbunden werden.');return}
    this.handle=h;this.pending=null;this.files={};try{await IDB.set('folder',h)}catch(e){}
    await this.load();toast(`📁 Ordner „${h.name}“ verbunden`);
  },
  async reconnect(){
    const h=this.pending;if(!h)return this.connect();
    try{if((await h.requestPermission({mode:'readwrite'}))!=='granted')return toast('Zugriff nicht erlaubt.')}catch(e){return this.connect()}
    this.handle=h;this.pending=null;await this.load();toast(`📁 Ordner „${h.name}“ verbunden`);
  },
  async disconnect(){this.handle=null;this.pending=null;this.files={};try{await IDB.del('folder')}catch(e){}renderAll();toast('Ordner getrennt – es wird weiter im Browser gespeichert.')},
  stamp(pb){return Math.max(pb.updated||0,...(pb.plays||[]).map(x=>x.updated||0))},
  async load(){   // read the folder and merge: the newer version of each playbook wins
    const found=[];
    try{for await(const e of this.handle.values()){
      if(e.kind!=='file'||!/\.json$/i.test(e.name))continue;
      try{const j=JSON.parse(await (await e.getFile()).text());
        if(j&&j.app==='playbook-builder-trash'){Trash.merge(j.items);continue}
        if(j&&j.app==='playbook-builder'&&j.playbook&&j.playbook.id&&VAR[j.playbook.variant]){const pb=cleanPb(j.playbook,true);if(j.fieldV&&!pb.fieldV)pb.fieldV=j.fieldV;found.push(pb);this.files[pb.id]=e.name}}catch(err){console.warn('skip',e.name,err)}
    }}catch(e){toast('Ordner konnte nicht gelesen werden.');this.handle=null;renderAll();return}
    found.forEach(pb=>{migrateFlag(pb);const i=state.pbs.findIndex(x=>x.id===pb.id);
      if(i<0)state.pbs.push(pb);else if(this.stamp(pb)>this.stamp(state.pbs[i]))state.pbs[i]=pb;});
    if(!state.pbs.find(x=>x.id===state.pbId)){const f=state.pbs[0];state.pbId=f?f.id:null;state.playId=f&&f.plays[0]?f.plays[0].id:null}
    else{const pb=curPb();if(!pb.plays.find(x=>x.id===state.playId))state.playId=pb.plays[0]?pb.plays[0].id:null}
    Store.saveLocal();renderAll();await this.flush();
  },
  fileName(pb){const base=fname(pb.name)||'playbook';const dup=state.pbs.some(x=>x!==pb&&fname(x.name)===base);return base+(dup?'_'+pb.id.slice(-4):'')+'.playbook.json'},
  async flush(){
    const h=this.handle;if(!h)return;
    try{
      for(const pb of state.pbs){
        const name=this.fileName(pb),old=this.files[pb.id];
        const fh=await h.getFileHandle(name,{create:true});const w=await fh.createWritable();
        await w.write(JSON.stringify({app:'playbook-builder',v:1,fieldV:pb.fieldV||FLAG_V,playbook:noCloud(pb)},null,1));await w.close();
        if(old&&old!==name){try{await h.removeEntry(old)}catch(e){}}
        this.files[pb.id]=name;
      }
      {const fh=await h.getFileHandle('Papierkorb.trash.json',{create:true});const w=await fh.createWritable();
        await w.write(JSON.stringify({app:'playbook-builder-trash',v:1,items:Trash.items}));await w.close();}
      for(const id of Object.keys(this.files)){if(!state.pbs.find(x=>x.id===id)){try{await h.removeEntry(this.files[id])}catch(e){}delete this.files[id]}}
    }catch(e){console.warn(e);toast('Speichern im Ordner fehlgeschlagen – bitte Ordner neu verbinden.');this.pending=this.handle;this.handle=null;renderAll()}
  }
};

function updateStatus(){
  const el=$('#status');if(!el)return;
  const saving=W.timers.size||W.busy.size;
  el.classList.toggle('warn',Store.mode==='memory'&&!Folder.handle);
  if(Folder.handle){el.textContent=saving?'Speichert…':`✓ Gespeichert im Ordner „${Folder.handle.name}“`;return}
  if(Store.mode==='memory'){el.textContent='Nicht gespeichert – Export nutzen';return}
  if(Sync.user){const st=Sync.state;el.classList.toggle('warn',st==='offline'||st==='error');
    el.textContent=saving||st==='busy'?'☁ Synchronisiert…':st==='offline'?'☁ Offline – wird später synchronisiert':st==='error'?'☁ Synchronisierung gestört':'☁ Synchronisiert';return}
  el.textContent=saving?'Speichert…':(Store.mode==='cloud'?'✓ Privat in deinem Konto gespeichert':'✓ Lokal in diesem Browser gespeichert');
}

/* ---------- geometry ---------- */
function VP(pb,pl){const v=VAR[pb.variant];const sh=(pl&&pl.losShift)||0;return {...v,up:v.up+sh,back:v.back-sh}}
function dims(v){const fw=(v.VW||v.W)*S,fh=(v.up+v.back)*S;return {fw,fh,los:v.up*S,cx:fw/2}}
function lenOf(pts){let l=0;for(let i=1;i<pts.length;i++)l+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return l}
function along(pts,d){
  if(pts.length===1)return pts[0];
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],sl=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(d<=sl||i===pts.length-1){const t=sl?Math.min(1,d/sl):1;return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}d-=sl;}
  return pts[pts.length-1];
}
function pathD(pts,curve){
  if(pts.length<2)return '';

  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }

}
function isDark(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return false;const n=parseInt(m[1],16);
  return (0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))<140}
function absPts(p,arr,base){return (arr||[]).map(q=>[base[0]+q.x*S,base[1]+q.y*S])}

    num=grass?'rgba(255,255,255,.5)':dark?'rgba(255,255,255,.26)':'#cfcac0',halo=grass?'#2c7442':dark?FIELD_BG.dark:(FIELD_BG[style]||FIELD_BG.light);

      if(yd<0&&yd%10===0){const off=Math.max(16,fw*0.1),fl=flip?' scale(1,-1)':'';

function arrowHead(a,b,col,k=1){

  const p1=[b[0]-L*Math.cos(ang-sp),b[1]-L*Math.sin(ang-sp)],p2=[b[0]-L*Math.cos(ang+sp),b[1]-L*Math.sin(ang+sp)];

}
// dark field: show dark colours light so lines and text stay readable
let RSTYLE='light';
function lighten(hex,k){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return hex;const n=parseInt(m[1],16);

function oneRoute(r,start,base,pcol,op,force,meta){

    if(len>0.01){dpts=pts.slice(0,-1).concat([[B[0]-(B[0]-A[0])/len*cut,B[1]-(B[1]-A[1])/len*cut]])}}

  else if(r.end==='bolt')s+=`<g transform="translate(${b[0].toFixed(1)},${b[1].toFixed(1)}) scale(.85)"><path d="M3-12-8 2h7l-3 10 11-14H0z" fill="${col}" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></g>`;
  else if(r.end==='block'){const ang=Math.atan2(b[1]-a[1],b[0]-a[0])+Math.PI/2,L=8*k;
    s+=`<line x1="${(b[0]-L*Math.cos(ang)).toFixed(1)}" y1="${(b[1]-L*Math.sin(ang)).toFixed(1)}" x2="${(b[0]+L*Math.cos(ang)).toFixed(1)}" y2="${(b[1]+L*Math.sin(ang)).toFixed(1)}" stroke="${col}" stroke-width="${sw+0.4}" stroke-linecap="round"/>`;}

function markMarkup(m,v,o){

function routeMarkup(p,base,faded,force,o){

function hintText(){

  if(state.drawing)return `<b>${{route:'Route',motion:'Motion',alt:'Alternative'}[state.drawing.kind]} zeichnen:</b> Tippe Punkte aufs Feld. <button class="btn sm primary" data-a="drawDone">✓ Fertig</button> <button class="btn sm" data-a="drawCancel">✕ Abbrechen</button> <span class="hint">(oder letzten Punkt erneut antippen / Enter)</span>`;

}

function restore(json){

  pb.plays[i]=pl;if(state.sel&&!selPlayer()&&!findMark(state.sel))state.sel=null;state.drawing=null;

function undo(){const pl=curPlay();if(!state.undo.length||!pl)return;state.redo.push(JSON.stringify(pl));restore(state.undo.pop())}

function selectPlay(id){state.pickMan=null;state.playId=id;state.multi=[];state.quizShown=false;state.sel=null;state.drawing=null;state.undo=[];state.redo=[];stopAnim(true);renderAll()}

/* ---------- field interaction ---------- */
function toField(e){

  const m=svg.getScreenCTM();if(!m)return null;const q=pt.matrixTransform(m.inverse());
  const pl=curPlay(),pb=curPb();if(pl&&pl.flipV)return [q.x,dims(VAR[pb.variant]).fh-q.y];return [q.x,q.y];
}

function findP(id){const pl=curPlay();return pl.players.find(p=>p.id===id)||pl.opp.find(p=>p.id===id)}

function drawRoute(p){const d=state.drawing;if(!d||!p)return null;return d.kind==='alt'?(p.alts||[])[d.j]:p[d.kind]}

// line from the defender to his man; corners can be added afterwards by pulling the ⊕ in the middle of a segment

  const route={pts:[{x:r1(o.x+dx/l*k-p.x),y:r1(o.y+dy/l*k-p.y)}],style:'solid',end:'none',curve:false,man:o.id,color:(p.route&&p.route.color)||defRouteColor(p)};
  commit();
  if(asAlt&&hasLine(p.route)){route.style='dotted';p.alts=p.alts||[];p.alts.push(route);state.selRoute={k:'alt',j:p.alts.length-1}}
  else{p.route=route;state.selRoute={k:'route',j:0}}

function continueDrawing(){

function startDrawing(kind,pid){

  commit();

  const dc=(p.route&&p.route.color)||defRouteColor(p);const pe=state.pendingEnd;state.pendingEnd=null;
  if(kind==='route'&&(pe==='bolt'||state.tplAlt)&&hasLine(p.route))kind='alt';   // keep the existing route, add an alternative
  if(kind==='alt'&&!hasLine(p.route))kind='route';   // no route yet: the first line is the route
  if(kind==='alt'){p.alts=p.alts||[];p.alts.push({pts:[],style:'solid',end:pe||'arrow',curve:false,color:dc});j=p.alts.length-1;}
  else{const prev=p[kind];
    p[kind]=kind==='route'?{pts:[],style:prev&&prev.style||'solid',end:pe||(prev&&prev.end!=='bolt'&&prev.end)||'arrow',curve:false,color:(prev&&prev.color)||dc}:{pts:[],curve:false,color:(prev&&prev.color)||dc};}

function finishDrawing(keepMode){

  if(p){const r=drawRoute(p);if(r){const arr=r.pts.filter((q,i,a)=>i===0||Math.hypot(q.x-a[i-1].x,q.y-a[i-1].y)>0.3);r.pts=arr;
    if(!hasLine(r)){if(d.kind==='alt')p.alts.splice(d.j,1);else p[d.kind]=null}}}
  state.drawing=null;state.cursor=null;state.pendingEnd=null;

function addPoint(q){

  if(arr.length){const l=arr[arr.length-1];if(Math.hypot(l.x-rel.x,l.y-rel.y)<0.9){finishDrawing();return}}

        state.selRoute=key;state.drag={type:'h',k:key.k,j:key.j,i,pid:p.id,moved:true,sx:q[0],sy:q[1]};svg.setPointerCapture(e.pointerId);renderField()}
      return}

    if(t&&t.dataset.m){const m=findMark(t.dataset.m);if(!m)return;

      state.drag={type:'m',mid:m.id,moved:false,sx:q[0],sy:q[1],ox:m.x,oy:m.y};svg.setPointerCapture(e.pointerId);return}
    if(t&&t.dataset.p){const id=t.dataset.p;const p=findP(id);
      if(e.shiftKey||e.ctrlKey||e.metaKey||state.multiMode){   // add to / remove from the group

        const dx=last.x-o.x,dy=last.y-o.y,l=Math.hypot(dx,dy)||1,k=Math.min(1,l*0.5);
        arr.push({x:r1(o.x+dx/l*k-dp.x),y:r1(o.y+dy/l*k-dp.y)});r.man=o.id;if(!r.pts.slice(0,-1).length||r.end==='arrow')r.end='none';
        finishDrawing();toast(`Man auf ${o.label||'Gegner'}`);return}}
    addPoint(q);return;

    commit();const k=ownKind(pb);
    const np={id:uid('p'),label:'?',x:snapV(x),y:snapV(y),shape:k==='off'?'circle':'text',color:PAL[pl.players.length%PAL.length],read:0,route:null,motion:null};

}
function onMove(e){
  const q=toField(e);if(!q)return;
  if(state.drawing){state.cursor=q;renderField();return}
  const d=state.drag;if(!d)return;
  if(!d.moved){if(Math.hypot(q[0]-d.sx,q[1]-d.sy)<3)return;d.moved=true;commit();}
  if(d.type==='los'){const pl=curPlay(),v0=VAR[curPb().variant];
    let target=Math.round((d.start+(q[1]-d.sy)/S)*2)/2;
    target=Math.max(-(v0.up-4),Math.min(v0.back-4,target));
    const diff=target-(pl.losShift||0);if(!diff)return;
    pl.losShift=target;
    const def=curPb().type==='defense'?pl.players:pl.opp; // offense stays attached to the LOS
    [...def,...(pl.marks||[])].forEach(p=>{p.y=r1(p.y-diff)});
    d.sy+=0;renderField();return}
  if(d.type==='zr'){const p=findP(d.pid);const r=p&&getRoute(p,d.key);if(!r)return;
    if(/[ew]/.test(d.h))r.zw=r1(Math.max(1,2*Math.abs(q[0]-d.cx)/S));
    if(/[ns]/.test(d.h))r.zh=r1(Math.max(1,2*Math.abs(q[1]-d.cy)/S));
    renderField();return}
  if(d.type==='zh'){const m=findMark(d.mid);if(!m)return;const dx=(q[0]-d.sx)/S,dy=(q[1]-d.sy)/S,h=d.h,MIN=1;
    let x=d.ox,y=d.oy,w=d.ow,ht=d.oh;
    if(h.includes('w')){w=Math.max(MIN,d.ow-dx);x=d.ox+d.ow-w}
    if(h.includes('e'))w=Math.max(MIN,d.ow+dx);
    if(h.includes('n')){ht=Math.max(MIN,d.oh-dy);y=d.oy+d.oh-ht}
    if(h.includes('s'))ht=Math.max(MIN,d.oh+dy);
    m.x=r1(x);m.y=r1(y);m.w=r1(w);m.h=r1(ht);renderField();return}
  if(d.type==='m'){const m=findMark(d.mid);if(!m)return;m.x=r1(d.ox+(q[0]-d.sx)/S);m.y=r1(d.oy+(q[1]-d.sy)/S);renderField();return}
  const p=findP(d.pid);if(!p)return;
  let [x,y]=toYd(q);[x,y]=clampYd(x,y);
  if(d.type==='p'){const nx=snapV(x),ny=snapV(y);
    if(d.group){const dx=nx-d.ox,dy=ny-d.oy;d.group.forEach(g=>{const o=findP(g.id);if(o){const c=clampYd(g.ox+dx,g.oy+dy);o.x=r1(c[0]);o.y=r1(c[1])}})}
    else{p.x=nx;p.y=ny}}
  else{const r=d.k==='alt'?(p.alts||[])[d.j]:p[d.k];const arr=r&&r.pts;if(arr&&arr[d.i]){arr[d.i]={x:r1(snapV(x)-p.x),y:r1(snapV(y)-p.y)}}}
  renderField();
}
function onUp(){const d=state.drag;state.drag=null;if(d&&d.moved)changed({field:false,center:true})}

/* ---------- templates ---------- */
function applyTemplate(i){
  const pb=curPb(),pl=curPlay(),p=pl.players.find(x=>x.id===state.sel);if(!p)return;
  const v=VP(pb,pl);const sx=p.x>=0.01?1:(p.x<=-0.01?-1:1);
  const clampAbs=(x,y)=>clampYd(x,y);const toRel=(ax,ay)=>{const [x,y]=clampAbs(ax,ay);return {x:r1(x-p.x),y:r1(y-p.y)}};
  let route;
  if(pb.type==='defense'){
    const t=DEF_T[i];const deep=-Math.min(16,v.up-3);let pts=[],end='zone',style='solid',zw=0,manId=null;
    switch(t.k){
      case 'blitz':pts=[toRel(0,3)];end='bolt';break;
      case 'contain':pts=[toRel(p.x+sx*1.5,0.5),toRel(sx*v.W*0.14,4)];end='arrow';break;
      case 'deep2':pts=[toRel(sx*v.W/4,deep)];break;
      case 'deep3':pts=[toRel(p.x<-v.W/6?-v.W/3:p.x>v.W/6?v.W/3:0,deep)];break;
      case 'deep4':pts=[toRel(sx*(Math.abs(p.x)>v.W/4?v.W*3/8:v.W/8),deep)];zw=r1(v.W/4*0.92);break;
      case 'deepm':pts=[toRel(0,deep)];break;
      case 'flat':pts=[toRel(sx*v.W*0.36,-4.5)];break;
      case 'hook':pts=[toRel(sx*v.W*0.17,-8)];break;
      case 'hole':pts=[toRel(0,-10)];break;
      case 'man':{
        if(!pl.opp.length||!pl.showOpp){toast('Für Man-Deckung zuerst oben einen Gegner einblenden.');return}
        state.pickMan={pid:p.id,alt:!!state.tplAlt};renderField();renderInsp();
        toast('Tippe jetzt den Gegenspieler an, den er decken soll');return;}
    }
    route={pts,style,end,curve:!!(route&&route.curve)};if(zw)route.zw=zw;if(manId)route.man=manId;
  } else {
    const t=OFF_T[i];let pts;
    if(t.abs)pts=t.abs.map(([x,y])=>toRel(x,y));
    else if(t.sweep){const s2=p.x<0?-1:1;pts=[toRel(p.x+s2*5,p.y+0.5),toRel(s2*v.W*0.3,0),toRel(s2*v.W*0.32,-5)]}
    else pts=t.p.map(([o,u])=>toRel(p.x+o*sx,p.y-u));
    route={pts,style:'solid',end:t.e||'arrow',curve:!!t.c};
  }
  route.color=(p.route&&p.route.color)||defRouteColor(p);
  commit();
  if(state.tplAlt&&hasLine(p.route)){route.style='dotted';p.alts=p.alts||[];p.alts.push(route);state.selRoute={k:'alt',j:p.alts.length-1}}
  else{p.route=route;state.selRoute={k:'route',j:0}}
  changed({insp:true});
}

/* ---------- animation ---------- */

// model of one play's animation: who runs where and when; reused for the live animation and for video/GIF
function animModel(pb,pl,opt){
  const v=VP(pb,pl);const {los,cx}=dims(v);
  const all=[...pl.players,...(pl.showOpp?pl.opp:[])];
  const vm=55,vr=75; // svg units per second
  const tr={};let mMax=0,T2=0;
  all.forEach(p=>{const b=[cx+p.x*S,los+p.y*S];
    const mot=[b,...absPts(p,p.motion&&p.motion.pts,b)];const me=mot[mot.length-1];
    const r=(opt&&p.alts&&p.alts[opt-1]&&p.alts[opt-1].pts.length)?p.alts[opt-1]:(hasLine(p.route)?p.route:(p.alts||[]).find(hasLine));   // players without that alternative run their main route
    const rt=[me,...absPts(p,r&&r.pts,b)];
    const ml=lenOf(mot),rl=lenOf(rt),f=(r&&r.speed)||1,d=(r&&r.delay)||0;
    tr[p.id]={mot,rt,ml,rl,f,d,r,b};mMax=Math.max(mMax,ml)});
  // man coverage: a defender whose line starts at a receiver stays with that receiver during the animation
  const defs=pb.type==='defense'?pl.players:(pl.showOpp?pl.opp:[]),recs=pb.type==='defense'?(pl.showOpp?pl.opp:[]):pl.players;
  defs.forEach(p=>{const k=tr[p.id],r=k&&k.r;if(!r||!r.pts||!r.pts.length||r.end==='zone'||r.end==='bolt')return;
    const P=r.pts.map(q=>[p.x+q.x,p.y+q.y]);const near=pt=>{let best=null,bd=2.2;recs.forEach(o=>{const dd=Math.hypot(o.x-pt[0],o.y-pt[1]);if(dd<bd){bd=dd;best=o}});return best};
    let rc=r.man&&recs.find(o=>o.id===r.man),via=P.slice(0,-1),end=P[P.length-1];
    if(!rc)rc=near(end);
    if(!rc&&(rc=near(P[0]))){via=[];end=P[0]}   // older lines that start at the receiver
    if(!rc||!tr[rc.id])return;
    let ox=end[0]-rc.x,oy=end[1]-rc.y;const l=Math.hypot(ox,oy);if(l>1.5){ox*=1.5/l;oy*=1.5/l}
    const path=[k.b,...via.map(([x,y])=>[k.b[0]+(x-p.x)*S,k.b[1]+(y-p.y)*S])];   // the way around other players, as drawn
    const pl0=lenOf(path),pe=path[path.length-1],rb=tr[rc.id].mot[0];
    const rest=Math.max(1,Math.hypot(rb[0]+ox*S-pe[0],rb[1]+oy*S-pe[1])),sp=vr*1.8;
    const kr=tr[rc.id],still=!(kr.ml>0.5||kr.rl>0.5);   // a receiver who does not move is not chased
    k.man={to:rc.id,off:[ox*S,oy*S],path,pl:pl0,rest,sp,still,mot:kr.ml>0.5,d0:kr.d,tc:still?0:Math.max(0.3,(pl0+rest)/sp)}});
  for(const id in tr){const k=tr[id];if(!k.man&&k.rl)T2=Math.max(T2,k.d+k.rl/(vr*k.f))}
  if(!mMax&&!T2&&!Object.values(tr).some(k=>k.man&&!k.man.still))return null;
  const T1=mMax/vm,gap=mMax?0.35:0;
  for(const id in tr){const m=tr[id].man;if(m&&!m.still)T2=Math.max(T2,(m.mot?-T1-gap:m.d0)+m.tc+0.2)}
  const M={tr,T1,gap,T2,vm,vr,total:T1+gap+T2,ball:null};
  // the ball: centre -> QB at the snap, then thrown to read 1
  const off=pb.type==='offense'?pl.players:(pl.showOpp?pl.opp:[]);const L=p=>(p.label||'').toUpperCase();
  const qb=off.find(p=>L(p)==='QB'),c=off.find(p=>L(p)==='C'),tg=off.find(p=>p.read===1&&p!==qb&&tr[p.id]&&tr[p.id].rl>0);
  if(qb){M.ball={qb:qb.id,c:c?c.id:null};
    if(tg){const k=tr[tg.id];const ta=Math.max(0.8,k.d+0.75*k.rl/(vr*k.f));const tp=routePos(M,k,ta),qp=routePos(M,tr[qb.id],ta);
      const fd=Math.max(0.25,Math.min(1.2,Math.hypot(tp[0]-qp[0],tp[1]-qp[1])/230));
      Object.assign(M.ball,{to:tg.id,rel:Math.max(0.3,ta-fd),arr:Math.max(0.3,ta-fd)+fd});M.total=Math.max(M.total,T1+gap+M.ball.arr)}}
  return M;
}
function routePos(M,k,t2){return along(k.rt,Math.max(0,Math.min((t2-k.d)*M.vr*k.f,k.rl)))}
function animAt(M,t){
  const pos={};const t2=t-M.T1-M.gap;
  for(const id in M.tr){const k=M.tr[id];pos[id]=t<M.T1+M.gap?along(k.mot,Math.min(t*M.vm,k.ml)):routePos(M,k,t2)}
  for(const id in M.tr){const k=M.tr[id];if(!k.man)continue;const tp=pos[k.man.to];if(!tp)continue;
    const m=k.man;if(m.still){pos[id]=k.b;continue}
    const ts=m.mot?t:t-M.T1-M.gap-m.d0;if(ts<=0){pos[id]=k.b;continue}   // wait until his man starts moving
    const g=[tp[0]+m.off[0],tp[1]+m.off[1]],d=ts*m.sp;
    if(d<m.pl){pos[id]=along(m.path,d);continue}   // first along the drawn way
    const pe=m.path[m.path.length-1],u=Math.min(1,(d-m.pl)/m.rest);   // then onto the receiver and stay with him
    pos[id]=[pe[0]+(g[0]-pe[0])*u,pe[1]+(g[1]-pe[1])*u]}
  let ball=null,bs=1;const B=M.ball;const mix=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];
  if(B){const q=pos[B.qb],cp=B.c&&pos[B.c];
    const hold=p=>[p[0]+9,p[1]+7];   // carried next to the player so the label stays readable
    if(t2<0)ball=hold(cp||q);
    else if(t2<0.18&&cp)ball=hold(mix(cp,q,t2/0.18));
    else if(!B.to||t2<B.rel)ball=hold(q);
    else if(t2<B.arr){const u=(t2-B.rel)/(B.arr-B.rel);ball=mix(hold(routePos(M,M.tr[B.qb],B.rel)),hold(routePos(M,M.tr[B.to],B.arr)),u);bs=1+0.7*Math.sin(Math.PI*u)}
    else ball=hold(pos[B.to]);}
  return {pos,ball,bs};
}
function animUI(){renderCenter();renderPresentBar()}
function animFrame(t){const a=state.anim;if(!a)return;const f=animAt(a.M,t);a.pos=f.pos;a.ball=f.ball;a.bs=f.bs;renderField()}
function startAnim(){
  const pb=curPb(),pl=curPlay();const M=animModel(pb,pl,state.animOpt||0);
  if(!M){toast('Keine Routen zum Abspielen.');return}
  state.sel=null;state.multi=[];state.drawing=null;state.quizShown=true;
  state.anim={M,t:0,playing:true,done:false,rate:state.animRate||1,pos:{},ball:null,bs:1,raf:0,last:performance.now()};
  animFrame(0);animUI();renderInsp();
  const step=now=>{
    const a=state.anim;if(!a)return;const dt=Math.min(0.1,(now-a.last)/1000);a.last=now;
    if(a.playing){a.t=Math.min(M.total+0.05,a.t+dt*a.rate);animFrame(a.t);
      if(a.t>=M.total+0.05){a.done=true;a.playing=false;animUI()}}   // stay at the end until sent back
    a.raf=requestAnimationFrame(step);
  };
  state.anim.raf=requestAnimationFrame(step);
}
function animPause(){const a=state.anim;if(!a)return;if(a.done)return;a.playing=!a.playing;a.last=performance.now();animUI();renderField()}
function animStepBy(d){const a=state.anim;if(!a)return;a.playing=false;a.t=Math.max(0,Math.min(a.M.total+0.05,a.t+d));a.done=a.t>=a.M.total+0.05;animFrame(a.t);animUI()}

function busyBox(text){const el=document.createElement('div');el.className='mback busy';el.innerHTML=`<div class="modal" style="max-width:340px;text-align:center"><h3>Bitte warten</h3><p id="busyText">${esc(text)}</p></div>`;document.body.appendChild(el);
  return {set(t){el.querySelector('#busyText').textContent=t},close(){el.remove()}}}
function svgImage(svg){return new Promise((res,rej)=>{const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));const img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);res(img)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Bild konnte nicht erzeugt werden'))};img.src=url})}
async function exportAnim(kind){
  const pb=curPb(),pl=curPlay();if(!pb||!pl||state.exporting)return;
  const M=animModel(pb,pl,state.animOpt||0);if(!M)return toast('Keine Routen zum Abspielen.');
  stopAnim(true);renderCenter();
  const {fw,fh}=dims(VP(pb,pl));const W=kind==='gif'?480:960,head=kind==='gif'?24:44,fhp=Math.round(fh*W/fw/2)*2,H=fhp+head;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d',{willReadFrequently:kind==='gif'});
  const title=`${playNo(pb,pl)}. ${pl.name||''}`,style=state.style;
  const draw=async t=>{const f=animAt(M,Math.max(0,Math.min(M.total,t)));
    const img=await svgImage(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${fhp}" viewBox="0 0 ${fw} ${fh}">${playMarkup(pb,pl,{anim:f.pos,ball:f.ball,bs:f.bs,style})}</svg>`);
    ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.drawImage(img,0,head,W,fhp);
    ctx.fillStyle=INK;ctx.font=`700 ${Math.round(head*0.52)}px Arial, Helvetica, sans-serif`;ctx.textBaseline='middle';ctx.fillText(title,10,head/2+1,W-20)};
  state.exporting=true;const busy=busyBox(kind==='gif'?'GIF wird erstellt…':'Video wird aufgenommen…');
  try{
    const name=fname(pl.name||'play');
    if(kind==='gif'){
      const dt=0.08,n=Math.ceil(M.total/dt)+1;const samples=[];
      for(const t of [0,M.total*0.35,M.total*0.7,M.total]){await draw(t);samples.push(ctx.getImageData(0,0,W,H).data)}
      const g=gifWriter(W,H,samples);
      for(let i=0;i<n;i++){await draw(i*dt);g.frame(ctx.getImageData(0,0,W,H).data,i===0?70:i===n-1?180:8);
        if(i%5===0){busy.set(`GIF wird erstellt… ${Math.round(i/n*100)} %`);await new Promise(r=>setTimeout(r,0))}}
      await saveFile(name+'.gif',new Blob([g.end()],{type:'image/gif'}));
    } else {
      const mime=window.MediaRecorder&&cv.captureStream?['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m)):null;
      if(!mime){toast('Dieser Browser kann kein Video aufnehmen – bitte „Als GIF“ nehmen.');return}
      await draw(0);const rec=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:3e6});const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      rec.start();const t0=performance.now(),lead=0.7,tail=1.2,dur=M.total+lead+tail;
      for(;;){const el=(performance.now()-t0)/1000;await draw(el-lead);busy.set(`Video wird aufgenommen… ${Math.min(100,Math.round(el/dur*100))} %`);if(el>dur)break;await new Promise(r=>setTimeout(r,16))}
      await new Promise(r=>{rec.onstop=r;rec.stop()});
      const type=mime.split(';')[0];await saveFile(name+(type==='video/mp4'?'.mp4':'.webm'),new Blob(chunks,{type}));
    }
  }catch(e){console.warn(e);toast('Export fehlgeschlagen'+(e&&e.message?': '+e.message:''))}
  finally{state.exporting=false;busy.close()}
}
// small GIF89a encoder: palette = the 255 most frequent colours of the play, unchanged pixels are transparent so files stay small
function gifWriter(W,H,samples){
  const cnt=new Map();samples.forEach(d=>{for(let j=0;j<d.length;j+=4){const k=(d[j]>>3)<<10|(d[j+1]>>3)<<5|(d[j+2]>>3);cnt.set(k,(cnt.get(k)||0)+1)}});
  const top=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).slice(0,255).map(e=>e[0]);
  const pal=top.map(k=>[((k>>10)&31)*8+4,((k>>5)&31)*8+4,(k&31)*8+4]);
  const near=new Map(top.map((k,i)=>[k,i]));
  const find=(r,g,b)=>{const k=(r>>3)<<10|(g>>3)<<5|(b>>3);let v=near.get(k);if(v!==undefined)return v;
    let best=0,bd=1e9;for(let i=0;i<pal.length;i++){const p=pal[i],d=(p[0]-r)*(p[0]-r)+(p[1]-g)*(p[1]-g)+(p[2]-b)*(p[2]-b);if(d<bd){bd=d;best=i}}near.set(k,best);return best};
  const out=[];const w16=v=>{out.push(v&255,(v>>8)&255)};
  'GIF89a'.split('').forEach(c=>out.push(c.charCodeAt(0)));w16(W);w16(H);out.push(0xF7,0,0);
  for(let i=0;i<256;i++){const c=pal[i]||[0,0,0];out.push(c[0],c[1],c[2])}
  out.push(0x21,0xFF,0x0B);'NETSCAPE2.0'.split('').forEach(c=>out.push(c.charCodeAt(0)));out.push(3,1,0,0,0);
  let prev=null;const N=W*H;
  return {
    frame(rgba,delay){
      const idx=new Uint8Array(N),px=new Uint8Array(N);
      for(let i=0,j=0;i<N;i++,j+=4){const c=find(rgba[j],rgba[j+1],rgba[j+2]);idx[i]=c;px[i]=prev&&prev[i]===c?255:c}
      const first=!prev;prev=idx;
      out.push(0x21,0xF9,4,first?0x04:0x05);w16(delay);out.push(255,0);
      out.push(0x2C);w16(0);w16(0);w16(W);w16(H);out.push(0,8);
      // LZW
      const buf=[];let cur=0,bits=0,size=9,next=258,dict=new Map();
      const emit=c=>{cur|=c<<bits;bits+=size;while(bits>=8){buf.push(cur&255);cur>>>=8;bits-=8}};
      emit(256);let pre=px[0];
      for(let i=1;i<N;i++){const k=px[i],key=pre<<8|k,v=dict.get(key);
        if(v!==undefined)pre=v;
        else{emit(pre);if(next===4096){emit(256);next=258;size=9;dict=new Map()}else{if(next>=(1<<size))size++;dict.set(key,next++)}pre=k}}
      emit(pre);emit(257);if(bits>0)buf.push(cur&255);
      for(let i=0;i<buf.length;i+=255){const n=Math.min(255,buf.length-i);out.push(n);for(let j=0;j<n;j++)out.push(buf[i+j])}
      out.push(0);
    },
    end(){out.push(0x3B);return new Uint8Array(out)}
  };
}

/* ---------- modal / toast ---------- */
function modal(title,body,buttons){
  return new Promise(res=>{
    const back=document.createElement('div');back.className='mback';
    back.innerHTML=`<div class="modal" role="dialog"><h3>${esc(title)}</h3><div class="mbody">${body}</div><div class="mbtns">${buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    document.body.appendChild(back);
    const close=v=>{back.remove();res(v)};
    back.addEventListener('click',e=>{if(e.target===back)close({value:null,el:back});const b=e.target.closest('.mbtns button');
      if(b){const bt=buttons[+b.dataset.i];if(bt.keep){bt.onClick&&bt.onClick(back);return}const out={value:bt.value,el:back};
        if(bt.validate&&!bt.validate(back))return;close(out)}});
    back.addEventListener('keydown',e=>{if(e.key==='Escape')close({value:null,el:back})});
    const f=back.querySelector('input,textarea,select');if(f)setTimeout(()=>f.focus({preventScroll:true}),30);
  });
}

function cleanPb(src,keep){

function importFlagPlay(j){

  const sty=x=>x==='dashed'?'dashed':x==='dotted'?'dotted':'solid';
  const shp=x=>x==='square'?'square':/tri/i.test(x||'')?'tri':'circle';

    const plays=j.plays.filter(p=>books.length===1||p.playbookId===b.id).sort((a,c)=>(a.order??0)-(c.order??0));
    if(!plays.length)return;

    const pb={id:uid('pb'),name:b.name||'FlagPlay Import',type,variant:'flag5',created:Date.now(),plays:[]};
    plays.forEach(fp=>{

        if(r.preSnap){p.motion={pts,curve:!!r.curved};return}

        rx:Math.min(99,(z.rx||0)/U),color:z.color||'#ef4444',opacity:z.opacity??0.2,dashed:z.borderStyle==='dashed',border:z.borderStyle!=='none'}));

        else if(a.shape==='bolt'){const [x,y]=pt(a.x,a.y);marks.push({id:uid('m'),type:'bolt',x,y,size:r1((a.size||20)/U),rot:a.rotation||0,color:a.color||'#f97316'})}

        players:conv.filter(c=>c.side===type).map(c=>c.o),opp:conv.filter(c=>c.side!==type).map(c=>c.o),oppForm:'',showOpp:true,marks,updated:Date.now()});

async function doImport(text){

function mergePb(loc,rem){
  const del={...(rem.del||{})};Object.entries(loc.del||{}).forEach(([k,v])=>{if(!del[k]||v>del[k])del[k]=v});
  const map=new Map();[...rem.plays,...loc.plays].forEach(pl=>{const o=map.get(pl.id);if(!o||(pl.updated||0)>(o.updated||0))map.set(pl.id,pl)});
  const order=[...rem.plays.map(p=>p.id),...loc.plays.map(p=>p.id)].filter((id,i,a)=>a.indexOf(id)===i);
  loc.plays=order.map(id=>map.get(id)).filter(pl=>pl&&!(del[pl.id]&&del[pl.id]>=(pl.updated||0)));
  const cut=Date.now()-90*864e5;Object.keys(del).forEach(k=>{if(del[k]<cut)delete del[k]});loc.del=del;
  if((rem.updated||0)>(loc.updated||0)){loc.name=rem.name;if(rem.layoutPlayId)loc.layoutPlayId=rem.layoutPlayId}

/* ---------- unexpected errors: tell the user, keep the data ---------- */
let crashAt=0;
function crash(err){
  const msg=String((err&&(err.stack||err.message))||err||'');
  if(!msg||/ResizeObserver|Script error|AbortError|NotAllowedError|The user aborted|play\(\) request/i.test(msg))return;
  console.error(err);
  try{if(state.anim){cancelAnimationFrame(state.anim.raf);state.anim=null}state.drag=null;state.drawing=null;flushAll()}catch(e){}
  if(Date.now()-crashAt<30000||$('.mback'))return;crashAt=Date.now();
  modal('Etwas ist schiefgelaufen',`<p>In der App ist ein unerwarteter Fehler aufgetreten. Deine Playbooks sind gespeichert.</p>
    <p class="hint">Du kannst weiterarbeiten. Wenn sich etwas seltsam verhält, lade die Seite neu. Mit „Fehler melden“ hilfst du, das Problem zu beheben.</p>
    <details><summary class="hint">Technische Details</summary><pre style="white-space:pre-wrap;font-size:11px;max-height:120px;overflow:auto">${esc(msg.slice(0,600))}</pre></details>`,
    [{label:'Neu laden',value:'reload'},{label:'Fehler melden',value:'report'},{label:'Weiterarbeiten',value:null,cls:'primary'}]).then(r=>{
      if(r.value==='reload')location.reload();
      if(r.value==='report')feedbackDialog('Automatisch erkannter Fehler:\n'+msg.slice(0,500)+'\n\nWas ich gerade gemacht habe: ');
      try{renderAll()}catch(e){}});
}
window.addEventListener('error',e=>crash(e.error||e.message));
window.addEventListener('unhandledrejection',e=>{const r=e.reason;if(r instanceof TypeError||r instanceof ReferenceError||r instanceof RangeError)crash(r)});

/* ---------- several tabs: take over what another tab saved ---------- */
window.addEventListener('storage',e=>{
  if(e.key===TRASH_KEY){Trash.load();renderSide();return}
  if(e.key!==LSK||Store.mode!=='local'||!e.newValue)return;
  let j;try{j=JSON.parse(e.newValue)}catch(err){return}
  if(!j||!Array.isArray(j.pbs))return;
  clearTimeout(W.timers.get('local'));W.timers.delete('local');W.fns.delete('local');   // do not write our older state over it
  state.pbs=j.pbs;state.drag=null;state.drawing=null;state.undo=[];state.redo=[];state.multi=[];
  const pb=curPb()||state.pbs[0];state.pbId=pb?pb.id:null;
  if(!pb||!pb.plays.find(x=>x.id===state.playId))state.playId=pb&&pb.plays[0]?pb.plays[0].id:null;
  if(state.sel&&!selPlayer()&&!findMark(state.sel))state.sel=null;
  if(state.anim)stopAnim(true);

function backupDue(){
  if(Store.mode!=='local'||Folder.handle||!state.pbs.some(pb=>pb.plays.length))return null;
  let last=0,snooze=0;try{last=+localStorage.getItem('pbb-lastBackup')||0;snooze=+localStorage.getItem('pbb-backupSnooze')||0}catch(e){return null}
  if(Date.now()<snooze)return null;
  if(!last)return 'Du hast noch keine Sicherung deiner Playbooks. Sie liegen nur in diesem Browser.';

}

/* ---------- version history per play (last 10 states, kept on this device) ---------- */
const Hist={mem:new Map(),at:{},
  async list(id){try{return (await IDB.get('h:'+id))||[]}catch(e){return this.mem.get(id)||[]}},
  async push(pl,force){
    const now=Date.now();if(!force&&now-(this.at[pl.id]||0)<10*60000)return;this.at[pl.id]=now;
    const json=JSON.stringify(pl);const l=await this.list(pl.id);if(l[0]&&l[0].json===json)return;
    l.unshift({at:now,json});l.length=Math.min(l.length,10);
    try{await IDB.set('h:'+pl.id,l)}catch(e){this.mem.set(pl.id,l)}
  }
};

function toPngBlob(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),'image/png')};img.onerror=rej;img.src=u})}
/* ---------- laser pointer for presenting: glowing red dot with a short fading trail ---------- */
const Laser={on:false,cv:null,ctx:null,pts:[],raf:0,
  toggle(v){this.on=v===undefined?!this.on:v;
    if(this.on){if(!this.cv){const c=document.createElement('canvas');c.id='laser';document.body.appendChild(c);this.cv=c;this.ctx=c.getContext('2d');
        addEventListener('resize',()=>this.size());addEventListener('pointermove',e=>this.move(e),{passive:true})}
      this.size();this.cv.style.display='block';document.body.classList.add('lasering');toast('🔴 Laserpointer an – Esc oder L zum Beenden');}
    else{if(this.cv)this.cv.style.display='none';document.body.classList.remove('lasering');this.pts=[];}
    const b=$('.laserbtn');if(b)b.classList.toggle('on',this.on);
  },
  size(){const d=devicePixelRatio||1;this.cv.width=innerWidth*d;this.cv.height=innerHeight*d;this.ctx.setTransform(d,0,0,d,0,0)},
  move(e){if(!this.on)return;this.pts.push({x:e.clientX,y:e.clientY,t:performance.now()});if(!this.raf)this.raf=requestAnimationFrame(()=>this.draw())},
  draw(){this.raf=0;const c=this.ctx,now=performance.now(),LIFE=450;
    this.pts=this.pts.filter(p=>now-p.t<LIFE);c.clearRect(0,0,innerWidth,innerHeight);if(!this.on)return;
    c.lineCap='round';c.lineJoin='round';
    for(let i=1;i<this.pts.length;i++){const a=this.pts[i-1],b=this.pts[i],k=1-(now-b.t)/LIFE;
      c.strokeStyle=`rgba(255,30,30,${0.55*k})`;c.lineWidth=2+6*k;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();}
    const h=this.pts[this.pts.length-1];
    if(h){const g=c.createRadialGradient(h.x,h.y,0,h.x,h.y,16);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,40,40,1)');g.addColorStop(1,'rgba(255,0,0,0)');
      c.fillStyle=g;c.beginPath();c.arc(h.x,h.y,16,0,Math.PI*2);c.fill();this.last=h}
    if(this.pts.length>1)this.raf=requestAnimationFrame(()=>this.draw());
    else if(this.last){const L=this.last,g=c.createRadialGradient(L.x,L.y,0,L.x,L.y,16);g.addColorStop(0,'#fff');g.addColorStop(.25,'rgba(255,40,40,1)');g.addColorStop(1,'rgba(255,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(L.x,L.y,16,0,Math.PI*2);c.fill()}
  }
};
function helpDialog(){

    <li><b>Playbook anlegen:</b> Offense oder Defense, Flag 5er oder Tackle 11er.</li>
    <li><b>Formation</b> über das Auswahlmenü laden, Spieler per Ziehen verschieben.</li>
    <li><b>Route / Auftrag:</b> Spieler antippen und rechts eine Vorlage wählen (Slant, Post, Blitz, Deep ⅓ …) – oder mit <b>↗ Route</b> selbst zeichnen.</li>

    <li><b>▶ Abspielen</b> animiert alle Routen – mit Pause, Einzelschritt (⏮ ⏭) und Tempo. Der Ball geht vom QB zum Spieler mit Read 1. Unter „Aktionen“ speicherst du die Animation als <b>Video oder GIF</b>.</li>
    <li><b>☑ Mehrere</b> (oder Umschalt-Klick): mehrere Spieler markieren, gemeinsam ziehen, ausrichten. <b>⧉ Kopieren</b> überträgt eine Route auf andere Spieler (Strg+C / Strg+V).</li>
    <li><b>Situationen</b> (z. B. „3rd &amp; long“, „Red Zone“) am Play vergeben – danach filtern und als <b>Call-Sheet</b> drucken.</li>
    <li><b>Playbook / Wristband</b> exportiert die ausgewählten Plays als PNG oder SVG oder druckt sie – Wristbands auch in Originalgröße mit Schnittmarken.</li>

    <li><b>📁 Ordner verbinden</b> (Chrome/Edge am PC): Playbooks werden automatisch als Dateien in einem Ordner auf deinem Gerät gespeichert – bleiben auch erhalten, wenn Browserdaten gelöscht werden.</li>
    <li><b>▣ Präsentieren:</b> Vollbild für Meetings – ←/→ wechselt das Play, Leertaste spielt ab, N zeigt Notizen, Esc beendet.</li>
    <li><b>🎓 Lernen</b> (im Präsentationsmodus): Die eigenen Aufgaben sind verdeckt, bis du mit „Aufdecken“ oder Taste A auflöst.</li>

    <li><b>🗑 Papierkorb:</b> Gelöschtes bleibt 30 Tage und lässt sich wiederherstellen.</li>
    <li><b>🔴 Laser</b> (Taste L): roter Laserpunkt zum Präsentieren – solange er an ist, wird nichts verändert. Esc beendet.</li>
    <li>Tastatur: V/R/M/P = Werkzeuge, Entf = Spieler löschen, Strg+Z / Strg+Y, Enter = Zeichnen beenden.</li></ul>
    <p class="hint">${Store.mode==='cloud'?'Jeder Nutzer hat eigene, private Playbooks in seinem Konto.':Store.mode==='local'?'Gespeichert wird lokal in diesem Browser. Für ein Backup nutze „Playbook teilen“.':'In dieser Ansicht kann nicht gespeichert werden – bitte exportieren.'}</p>`,

function copyRoute(){const p=selPlayer();const key=p&&!isOpp(p.id)&&curRouteKey(p);const r=key&&getRoute(p,key);if(!r||!r.pts.length)return false;
  state.clip={k:key.k==='motion'?'motion':'route',r:clone(r)};toast('Linie kopiert – anderen Spieler wählen und einfügen');renderInsp();return true}
function pasteRoute(mirror){
  if(!state.clip)return;const ids=(state.multi.length>1?state.multi:[state.sel]).filter(id=>id&&findP(id)&&!isOpp(id));if(!ids.length)return toast('Wähle zuerst einen eigenen Spieler.');
  commit();ids.forEach(id=>{const p=findP(id);const r=clone(state.clip.r);if(mirror)r.pts.forEach(q=>{q.x=-q.x});
    if(state.clip.k==='motion')p.motion=r;else if(state.tplAlt&&hasLine(p.route)&&ids.length===1){(p.alts=p.alts||[]).push(r);state.selRoute={k:'alt',j:p.alts.length-1}}else p.route=r});
  changed({insp:true});toast(ids.length>1?`Bei ${ids.length} Spielern eingefügt`:'Eingefügt');
}
function multiAct(act){
  const ps=state.multi.map(findP).filter(Boolean);if(ps.length<2)return;const ref=ps[ps.length-1];commit();
  if(act==='alignY')ps.forEach(p=>{p.y=ref.y});
  if(act==='alignX')ps.forEach(p=>{p.x=ref.x});
  if(act==='distX'){const a=ps.slice().sort((x,y)=>x.x-y.x);const l=a[0].x,r=a[a.length-1].x;a.forEach((p,i)=>{p.x=r1(l+(r-l)*i/(a.length-1))})}
  if(act==='multiDel'){const pl=curPlay(),ids=state.multi;pl.players=pl.players.filter(p=>!ids.includes(p.id));pl.opp=pl.opp.filter(p=>!ids.includes(p.id));state.multi=[];state.sel=null}
  changed({insp:true});
}
function deletePlayer(){

  pl.players=pl.players.filter(p=>p.id!==state.sel);pl.opp=pl.opp.filter(p=>p.id!==state.sel);pl.marks=(pl.marks||[]).filter(m=>m.id!==state.sel);state.sel=null;state.drawing=null;changed({insp:true});
}

  if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();return redo()}
  if((e.ctrlKey||e.metaKey)&&k==='c'&&!String(getSelection()||'')){if(copyRoute())e.preventDefault();return}
  if((e.ctrlKey||e.metaKey)&&k==='v'&&state.clip&&(state.sel||state.multi.length)){e.preventDefault();return pasteRoute(e.shiftKey)}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(k==='enter'&&state.drawing){e.preventDefault();return finishDrawing()}
  if(k==='escape'&&state.pickMan){state.pickMan=null;renderField();renderInsp();return}
  if(k==='escape'){if(state.drawing){const p=curPlay().players.find(x=>x.id===state.drawing.pid);if(p&&drawArr(p).length)return finishDrawing();state.drawing=null;state.cursor=null;undo();return}
    state.sel=null;state.mode='select';renderCenter();return renderInsp()}
  if((k==='delete'||k==='backspace')&&state.multi.length>1){e.preventDefault();return multiAct('multiDel')}
  if((k==='delete'||k==='backspace')&&state.sel){e.preventDefault();return deletePlayer()}
  const map={v:'select',r:'route',m:'motion',p:'add'};
  if(map[k]){const b=document.querySelector(`[data-mode="${map[k]}"]`);if(b)b.click()}
});

/* ---------- init ---------- */
(async function init(){
  renderAll();
  Trash.load();
  const data=await Store.init();
  state.pbs=Array.isArray(data)?data:[];
  state.pbs.forEach(pb=>{if(migrateFlag(pb)){Store.savePb(pb);pb.plays.forEach(pl=>Store.savePlay(pb,pl))}});
  Sync.start();
  let last=null;try{last=JSON.parse(localStorage.getItem('pbb-ui')||'{}').pb}catch(e){}
  const pb=state.pbs.find(p=>p.id===last)||state.pbs[0];
  state.pbId=pb?pb.id:null;state.playId=pb&&pb.plays[0]?pb.plays[0].id:null;
  try{await Folder.init()}catch(e){console.warn(e)}
  showBanner();renderAll();
})();
</script>
